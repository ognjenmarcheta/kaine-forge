# Root Cargo workspace: one lockfile, one toolchain, one lint policy for every
# Rust crate (ADR 0025). Crates opt in with `[lints] workspace = true`.
[workspace]
resolver = "2"
members = ["apps/desktop/src-tauri", "apps/desktop-native"]

[workspace.package]
authors = ["Kaine Forge"]
license = "Apache-2.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
# GPUI Kit pins its matching GPUI release (`gpui-pre`) exactly and re-exports it,
# so the app lists one UI dependency. 0.x minors break; bumps are deliberate PRs.
gpui-kit = "=0.9.0"
anyhow = "1"
# The same major as gpui-component, so `rust_i18n::extend!` shares one backend.
rust-i18n = "4.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
# GPUI's HTTP client implementation, from the same gpui-pre family the kit pins.
reqwest_client = { package = "gpui-pre-reqwest-client", version = "=0.3.11" }
# GraphQL operations compiled from .graphql files against apps/api/schema.graphql.
graphql_client = "0.16"
# The OS credential store for the bearer session token.
keyring = "4"
futures = "0.3"

[workspace.lints.rust]
unsafe_code = "deny"
unused_qualifications = "warn"

# Adopted from Zed, GPUI Kit, Turborepo and oxc. Groups at warn become errors
# under `-D warnings`; the allows below are the documented exceptions.
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "deny"
print_stderr = "deny"
unwrap_used = "deny"
expect_used = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"

# GPUI Kit's install guide names the crates worth optimising in dev: text layout
# and shaping are unusable at opt-level 0, and the kit measured opt-level 1 as
# 22-25% slower scrolling than 3. Every other dependency, the Tauri stack
# included, keeps the default so a dev build stays fast to produce.
[profile.dev.package]
gpui-pre = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
gpui-component = { opt-level = 3 }
gpui-kit = { opt-level = 3 }
gpui-kit-assets = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }

# One release profile for both desktop apps (Cargo reads profiles from the
# workspace root only). Speed over size: Tauri's size guide also suggests
# `opt-level = "s"` and `panic = "abort"`, which would slow GPUI's renderer and
# turn every panic into a silent exit, so neither is set (ADR 0025).
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
