# Root Cargo workspace: one lockfile, one toolchain, one lint policy for every
# Rust crate (ADR 0025). Crates opt in with `[lints] workspace = true`.
[workspace]
resolver = "2"
members = ["apps/desktop/src-tauri", "apps/desktop-native"]

[workspace.package]
authors = ["Kaine Forge"]
license = "Apache-2.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
# GPUI Kit pins its matching GPUI release (`gpui-pre`) exactly and re-exports it,
# so the app lists one UI dependency. 0.x minors break; bumps are deliberate PRs.
gpui-kit = "=0.9.0"
anyhow = "1"
# The same major as gpui-component, so `rust_i18n::extend!` shares one backend.
rust-i18n = "4.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"

[workspace.lints.rust]
unsafe_code = "deny"
unused_qualifications = "warn"

# Adopted from Zed, GPUI Kit, Turborepo and oxc. Groups at warn become errors
# under `-D warnings`; the allows below are the documented exceptions.
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "deny"
print_stderr = "deny"
unwrap_used = "deny"
expect_used = "deny"
redundant_clone = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"

# GPUI compiles slowly; optimising the heavy crates in dev keeps `cargo run`
# usable, as GPUI Kit's own workspace does.
[profile.dev.package."*"]
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
