services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: monorepo_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d monorepo_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  # RustFS: an S3-compatible server on MinIO's ports. MinIO's public images no
  # longer pull (#685). The credentials match S3_ACCESS_KEY / S3_SECRET_KEY in .env.example.
  storage:
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - storage_data:/data

  # Creates the buckets through the S3 API: the private Attachment bucket, with
  # CORS for the browser's direct PUT, and the public-read Public Asset bucket.
  storage-init:
    image: amazon/aws-cli:2.37.13
    depends_on:
      - storage
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_DEFAULT_REGION: us-east-1
      AWS_ENDPOINT_URL: http://storage:9000
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until aws s3api list-buckets > /dev/null 2>&1; do
          echo 'waiting for storage...'; sleep 1
        done
        aws s3api head-bucket --bucket kaine-forge-dev 2>/dev/null ||
          aws s3api create-bucket --bucket kaine-forge-dev
        aws s3api put-bucket-cors --bucket kaine-forge-dev --cors-configuration \
          '{"CORSRules":[{"AllowedOrigins":["*"],"AllowedMethods":["GET","PUT"],"AllowedHeaders":["*"],"MaxAgeSeconds":3000}]}'
        aws s3api head-bucket --bucket kaine-forge-dev-public 2>/dev/null ||
          aws s3api create-bucket --bucket kaine-forge-dev-public
        aws s3api put-bucket-policy --bucket kaine-forge-dev-public --policy \
          '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":"*","Action":["s3:GetObject"],"Resource":["arn:aws:s3:::kaine-forge-dev-public/*"]}]}'

volumes:
  pgdata:
  storage_data:
