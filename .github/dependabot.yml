# Dependabot config for npm/pnpm workspace updates.
# Labels match renovate.json so dep PRs skip the Changeset Required gate
# (apps/** package.json bumps would otherwise fail CI without a release entry).
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - release:skip-changeset
    # pnpm catalogs live in pnpm-workspace.yaml; Dependabot updates lock + manifests.
    versioning-strategy: increase
    # Mirror Renovate (issue #198): mobile Expo/RN singleton graph moves only with
    # intentional Expo SDK upgrades (catalogs.mobile + monorepo-alignment tests).
    # Majors below need intentional PRs (compiler lint rules / i18next types), not bot merges.
    ignore:
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "nativewind"
      - dependency-name: "@react-navigation/*"
      - dependency-name: "@react-native-async-storage/*"
      - dependency-name: "@react-native-community/*"
      - dependency-name: "eslint-plugin-react-hooks"
        update-types: ["version-update:semver-major"]
      - dependency-name: "i18next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "lucide-react"
        update-types: ["version-update:semver-major"]
