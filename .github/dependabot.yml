# Dependabot is the single dependency bot for this template: npm (workspace
# manifests + pnpm catalogs), GitHub Actions SHA pins, Docker base-image
# digests, the Tauri Cargo graph, and Compose image tags. Downstream projects
# that prefer Renovate can swap it in; do not run both.
# Labels: `dependencies` for kaine-triage-deps and `release:skip-changeset`
# so bot PRs pass the Changeset Required gate (apps/** package.json bumps would
# otherwise fail CI without a release entry).
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - release:skip-changeset
    # pnpm catalogs live in pnpm-workspace.yaml; Dependabot updates lock + manifests.
    # No cooldown block: Dependabot's default 3-day cooldown applies, and
    # pnpm-workspace.yaml mirrors it as minimumReleaseAge so the ungated
    # `pnpm update` step cannot pull a release the gated install rejects (#356).
    versioning-strategy: increase
    groups:
      # A dependency goes to the most specific matching group, not the first one:
      # an exact pattern outranks a group without patterns, which outranks a
      # wildcard pattern (dependabot-core PatternSpecificityCalculator). So
      # non-major must exclude every pattern below, or it takes the scoped
      # companions (@better-auth/expo, @vitest/*) and splits each pair (#543).
      #
      # better-auth and its Expo companion sit on one catalog line and must
      # move together.
      better-auth:
        patterns:
          - "better-auth"
          - "@better-auth/*"
      # vitest, @vitest/coverage-v8 and @vitest/ui are peers pinned to one catalog
      # version; a lone bump fails the lockstep guard in monorepo-alignment (#324).
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      # The TanStack DB release-candidate set is one exact-pinned graph in the
      # catalog: a lone bump installs a second @tanstack/db and the sync engine
      # stops typechecking (#876 to #881).
      tanstack-db:
        patterns:
          - "@tanstack/db"
          - "@tanstack/react-db"
          - "@tanstack/offline-transactions"
          - "@tanstack/*db-sqlite-persistence*"
      # One weekly PR for every minor and patch bump instead of a PR storm.
      non-major:
        update-types:
          - minor
          - patch
        exclude-patterns:
          - "better-auth"
          - "@better-auth/*"
          - "vitest"
          - "@vitest/*"
          - "@tanstack/db"
          - "@tanstack/react-db"
          - "@tanstack/offline-transactions"
          - "@tanstack/*db-sqlite-persistence*"
    # Mobile Expo/RN singleton graph moves only with intentional Expo SDK
    # upgrades (catalogs.mobile + monorepo-alignment tests, issue #198). Scoped
    # `@expo/*` packages need their own entry: `expo-*` does not match them.
    # Majors below need intentional PRs (compiler lint rules / i18next types), not bot merges.
    ignore:
      # React and its types live in two catalogs (web caret ranges, mobile exact
      # Expo SDK pins). Dependabot cannot target the mobile catalog and instead
      # rewrites the web ranges to exact pins on every weekly run (#327, #340,
      # #347). React moves by intentional PR: `pnpm update react react-dom` for
      # web, the Expo SDK upgrade for mobile.
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "@types/react"
      - dependency-name: "@types/react-dom"
      - dependency-name: "expo"
      - dependency-name: "expo-*"
      - dependency-name: "@expo/*"
      - dependency-name: "react-native"
      - dependency-name: "react-native-*"
      - dependency-name: "nativewind"
      - dependency-name: "@react-navigation/*"
      - dependency-name: "@react-native-async-storage/*"
      - dependency-name: "@react-native-community/*"
      - dependency-name: "eslint-plugin-react-hooks"
        update-types: ["version-update:semver-major"]
      - dependency-name: "i18next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "lucide-react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "chalk"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "graphql"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pino"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]
      # Deferred on 2026-09-09 (#287): each needs its own migration, not a bot merge.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@changesets/cli"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@graphql-inspector/cli"
        update-types: ["version-update:semver-major"]
      # @types/node tracks the Node major in .nvmrc / engines / Dockerfiles.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # @journeyapps/wa-sqlite follows the peer range of @tanstack/browser-db-sqlite-persistence
      # (^1.4.1 through 1.0.0-rc.1.3); 2.x arrives with the persistence upgrade (#829).
      - dependency-name: "@journeyapps/wa-sqlite"
        update-types: ["version-update:semver-major"]
      # @simplewebauthn/server is in the catalog only so packages/auth can name the passkey
      # plugin's inferred types; it follows @better-auth/passkey's own dependency (^13.3.2), so a
      # catalog major installs a second copy without moving the plugin (#828).
      - dependency-name: "@simplewebauthn/server"
        update-types: ["version-update:semver-major"]
      # tailwindcss lives in two catalogs like React: web on v4 in the default
      # catalog and mobile pinned to 3.4.17 in catalogs.mobile under the Expo SDK
      # freeze (pnpm-workspace.yaml). Any update can rewrite one lane to the
      # other's line (#534 turned web ^4.3.3 into ^3.4.19 on a patch), so it is
      # ignored fully; Tailwind moves by intentional PR per lane (#520, #535).
      - dependency-name: "tailwindcss"

  # Workflows pin actions to commit SHAs with a `# vN` comment; Dependabot bumps
  # the SHA and keeps the comment current. Grouped: one PR per week.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - release:skip-changeset
    groups:
      github-actions:
        patterns:
          - "*"
    # changesets/action moves together with @changesets/cli (inputs change across
    # majors); both majors are intentional migrations, not bot bumps (#287).
    ignore:
      - dependency-name: "changesets/action"
        update-types: ["version-update:semver-major"]

  # Dockerfile.api, Dockerfile.web, the ARC runner image, and the runner cluster
  # manifests (tooling/ci-runners/*.yaml) pin images by tag@digest. Dependabot
  # reads files whose name contains "dockerfile" and the image: keys of
  # Kubernetes manifests in these directories, and bumps the tag and sha256.
  - package-ecosystem: docker
    directories:
      - "/"
      - "/tooling/ci-runners"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - release:skip-changeset
    # Node majors are a deliberate migration across .nvmrc, engines, Dockerfiles,
    # and CI (#323: node:26-slim has no corepack and broke both images). Digest
    # bumps within the major still flow.
    ignore:
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  # The Tauri shell's Rust graph (apps/desktop/src-tauri/Cargo.lock) has no other
  # refresh path, so crates.io advisories sat open (#357). Grouped: one PR per
  # week. Tauri majors are intentional migrations, not bot bumps.
  - package-ecosystem: cargo
    directory: "/apps/desktop/src-tauri"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - release:skip-changeset
    groups:
      cargo:
        patterns:
          - "*"
    ignore:
      - dependency-name: "tauri"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tauri-*"
        update-types: ["version-update:semver-major"]

  # docker-compose.yml pins the local postgres, RustFS, and aws-cli images by tag; the
  # docker ecosystem above reads only Dockerfiles (#357). Grouped: one PR per week.
  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - release:skip-changeset
    groups:
      docker-compose:
        patterns:
          - "*"
    # Postgres majors move together with the CI service containers in ci-pr.yml
    # and release.yml (not bot-managed) and need a pgdata volume migration.
    ignore:
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
