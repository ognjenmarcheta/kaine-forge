name: Bug report
description: Something in the template is broken or behaves unexpectedly.
labels: ["type:fix"]
# The six required fields are the issue format of docs/agents/issue-format.md. Their labels
# become the headings that the agent desk reads at intake. Keep them in step with that page.
body:
  - type: textarea
    id: outcome
    attributes:
      label: Outcome
      description: What should happen instead? One observable behavior.
      placeholder: Running X produces Y.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What must be true for this to be done? One checkable statement per line.
      placeholder: "- Running X produces Y\n- pnpm check stays green"
    validations:
      required: true
  - type: input
    id: area
    attributes:
      label: Scope
      description: Workspaces or paths in scope, or "unknown, investigate first".
      placeholder: e.g. apps/api, packages/auth, .ai/ tooling, docs
    validations:
      required: true
  - type: dropdown
    id: validation-tier
    attributes:
      label: Validation
      description: Which checks close the loop? See docs/agents/day-one.md section 5.
      options:
        - "Docs / .ai only — pnpm ai:doctor, pnpm format:check"
        - "Package/app code — pnpm check (plus pnpm build:core for API/web runtime)"
        - "User-visible web/API flow — also pnpm test:e2e"
        - "Unsure"
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: Evidence
      description: What did you do, and what happened? Steps, command output, or a path:line.
      placeholder: Steps to reproduce, expected behavior, actual behavior.
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: Anything an agent should deliberately not change, or "None".
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: OS, Node version, pnpm version, commit or release.
