name: Bug report
description: Something in the template is broken or behaves unexpectedly.
labels: ["type:fix"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
      placeholder: Steps to reproduce, expected behavior, actual behavior.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What must be true for this to be done? One checkable statement per line.
      placeholder: "- Running X produces Y\n- pnpm check stays green"
    validations:
      required: true
  - type: input
    id: area
    attributes:
      label: Affected workspace or area
      description: Workspaces or paths in scope, or "unknown - investigate first".
      placeholder: e.g. apps/api, packages/auth, .ai/ tooling, docs
  - type: dropdown
    id: validation-tier
    attributes:
      label: Validation tier
      description: Which checks close the loop? See docs/agents/day-one.md section 5.
      options:
        - "Docs / .ai only — pnpm ai:doctor, pnpm format:check"
        - "Package/app code — pnpm check (plus pnpm build:core for API/web runtime)"
        - "User-visible web/API flow — also pnpm test:e2e"
        - "Unsure"
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: OS, Node version, pnpm version, commit or release.
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: Anything an agent should deliberately not change.
