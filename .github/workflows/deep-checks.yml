name: Deep Checks

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 2,5"

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.29.3"

jobs:
  mobile-export:
    name: Mobile Export Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Export mobile bundle
        run: CI=1 EXPO_NO_WATCHMAN=1 pnpm --filter @repo/mobile exec expo export --platform ios --output-dir /tmp/mobile-export

  desktop-check:
    name: Desktop Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run desktop check
        run: pnpm --filter @repo/desktop check
