name: Docker Cache

# Seeds the per-app Docker layer cache from main (issue #359). GitHub Actions
# caches are readable from the current branch and the default branch only. The
# Docker Image job in ci-pr.yml writes `type=gha,scope=<app>` on pull_request
# and merge_group, so a PR branch could only ever hit layers it had built
# itself, and nothing wrote main's scope: every new branch's first Docker Image
# job ran cold (~4 min vs ~1 min warm). Building here on push to main fills the
# default-branch scope that PR branches fall back to.
#
# Cache-only: no `load`, no `push`, no scan. Trivy and SBOM stay on the PR job.

on:
  push:
    branches:
      - main
    # Same list as the `docker` path filter in ci-pr.yml, so docs-only pushes
    # skip the seed exactly when they would skip the PR image build.
    paths:
      - "Dockerfile.api"
      - "Dockerfile.web"
      - "apps/api/**"
      - "apps/web/**"
      - "packages/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".npmrc"
      - "turbo.json"
      - "tsconfig.base.json"
  workflow_dispatch:

concurrency:
  # A newer push to main supersedes the older seed. Cancelling only skips that
  # run's cache export; the next run writes it.
  group: docker-cache-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docker-cache:
    name: Docker Cache (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            dockerfile: Dockerfile.api
          - app: web
            dockerfile: Dockerfile.web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Must match the PR job's build inputs (context, file, no build-args):
      # any difference changes the layer keys and the PR build misses the cache.
      # mode=max exports the intermediate pruner/builder stages too, which is
      # where the pnpm install and turbo build layers live.
      - name: Build ${{ matrix.app }} image (cache only)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
