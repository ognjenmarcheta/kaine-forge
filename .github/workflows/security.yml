name: Security

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
  push:
    branches:
      - main

permissions:
  contents: read
  security-events: write

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "10.29.3"

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run audit (high and critical)
        shell: bash
        run: |
          set -euo pipefail

          max_attempts=3
          for attempt in $(seq 1 "${max_attempts}"); do
            echo "Running pnpm audit (attempt ${attempt}/${max_attempts})..."

            set +e
            pnpm audit --audit-level high > audit.out 2> audit.err
            status=$?
            set -e

            cat audit.out
            cat audit.err >&2

            if [ "${status}" -eq 0 ]; then
              echo "pnpm audit completed successfully."
              exit 0
            fi

            if grep -Eq "ERR_PNPM_AUDIT_BAD_RESPONSE|Internal Server Error|security/audits.*500" audit.err; then
              if [ "${attempt}" -lt "${max_attempts}" ]; then
                echo "Audit endpoint is unstable. Retrying in 15 seconds..."
                sleep 15
                continue
              fi

              echo "::warning::pnpm audit failed due to npm audit endpoint instability (HTTP 500). Skipping failure."
              exit 0
            fi

            echo "pnpm audit failed for a non-transient reason."
            exit "${status}"
          done

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
