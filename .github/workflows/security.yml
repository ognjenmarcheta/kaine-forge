name: Security

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
  push:
    branches:
      - main

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: "10.29.3"

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: ${{ fromJSON(github.event.repository.visibility == 'private' && vars.CI_SELF_HOSTED_LINUX == 'true' && fromJSON(vars.CI_SELF_HOSTED_LINUX) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","linux","x64","kaine-ci-linux"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Run audit (moderate and above)
        # Fails the job on moderate, high, or critical advisories (pnpm audit exit non-zero).
        # To accept a known advisory, add it to auditConfig.ignoreGhsas in
        # pnpm-workspace.yaml and document it in the PR, as SECURITY.md requires.
        run: pnpm audit --audit-level moderate

  cargo-audit:
    name: Cargo Audit
    # The Tauri shell's Rust graph (apps/desktop/src-tauri/Cargo.lock) gets
    # Dependabot updates but had no advisory gate. cargo audit fails on RustSec
    # vulnerability advisories; unmaintained and unsound notices print as warnings.
    runs-on: ${{ fromJSON(github.event.repository.visibility == 'private' && vars.CI_SELF_HOSTED_LINUX == 'true' && fromJSON(vars.CI_SELF_HOSTED_LINUX) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","linux","x64","kaine-ci-linux"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 20
    env:
      CARGO_AUDIT_VERSION: "0.22.2"
      # sha256 of cargo-audit-x86_64-unknown-linux-musl-v<version>.tgz from the
      # rustsec/rustsec release. Change it together with the version.
      CARGO_AUDIT_SHA256: "7fb9497f8594b389e5fce5ef9b92db08432996895b2e0c5a0167a69ed445c428"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The static release binary needs no Rust toolchain or C linker, which the
      # ARC runner image (tooling/ci-runners/runner.Dockerfile) does not have, and
      # it reads the committed Cargo.lock without calling cargo.
      - name: Install cargo-audit
        run: |
          set -euo pipefail
          name="cargo-audit-x86_64-unknown-linux-musl-v${CARGO_AUDIT_VERSION}"
          curl -fsSLo "$RUNNER_TEMP/$name.tgz" \
            "https://github.com/rustsec/rustsec/releases/download/cargo-audit%2Fv${CARGO_AUDIT_VERSION}/$name.tgz"
          echo "${CARGO_AUDIT_SHA256}  $RUNNER_TEMP/$name.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$name.tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$name" >> "$GITHUB_PATH"

      - name: Run cargo audit
        working-directory: apps/desktop/src-tauri
        # RUSTSEC-2024-0429 (GHSA-wrw7-89jp-8q8g, glib 0.18.5) is an accepted risk:
        # the fix is glib 0.20, which the Tauri 2 gtk-rs 0.18 stack does not allow,
        # and nothing in the graph calls the unsound VariantStrIter. SECURITY.md
        # records the reason and the removal trigger.
        run: cargo-audit audit --ignore RUSTSEC-2024-0429

  secret-scan:
    name: Secret Scan
    runs-on: ${{ fromJSON(github.event.repository.visibility == 'private' && vars.CI_SELF_HOSTED_LINUX == 'true' && fromJSON(vars.CI_SELF_HOSTED_LINUX) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","linux","x64","kaine-ci-linux"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The action defaults to 8.24.3, which ignores [[allowlists]] in
          # .gitleaks.toml and so fails full-history scans on the desk fixtures.
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_CONFIG: .gitleaks.toml

  # ci-pr.yml scans images only for pull requests, so main's Trivy alerts went
  # stale between manual runs (issue #506). Same categories as the PR upload,
  # so alerts for packages main no longer ships close. Report-only: the PR job
  # owns the blocking gate.
  image-scan:
    name: Image Scan (${{ matrix.app }})
    runs-on: ${{ fromJSON(github.event.repository.visibility == 'private' && vars.CI_SELF_HOSTED_LINUX == 'true' && fromJSON(vars.CI_SELF_HOSTED_LINUX) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","linux","x64","kaine-ci-linux"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            dockerfile: Dockerfile.api
          - app: web
            dockerfile: Dockerfile.web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Same daily key as ci-pr.yml and docker-cache.yml, so the scan sees today's
      # OS upgrade layers and reuses main's cache.
      - name: Compute apt refresh key
        id: apt
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      # Read-only cache: docker-cache.yml owns writing main's scope.
      - name: Build ${{ matrix.app }} image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: APT_REFRESH=${{ steps.apt.outputs.day }}
          tags: local/${{ matrix.app }}:main
          load: true
          cache-from: type=gha,scope=${{ matrix.app }}

      - name: Scan ${{ matrix.app }} image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/${{ matrix.app }}:main
          format: sarif
          output: trivy-${{ matrix.app }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload Trivy SARIF
        if: |
          github.event.repository.visibility == 'public' ||
          vars.ENABLE_GITHUB_CODE_SCANNING == 'true'
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          sarif_file: trivy-${{ matrix.app }}.sarif
          category: trivy-${{ matrix.app }}
