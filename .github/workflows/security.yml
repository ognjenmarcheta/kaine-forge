name: Security

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
  push:
    branches:
      - main

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: "10.29.3"

jobs:
  dependency-audit:
    name: Dependency Audit
    runs-on: ${{ fromJSON(github.event.repository.visibility == 'private' && vars.CI_SELF_HOSTED_LINUX == 'true' && fromJSON(vars.CI_SELF_HOSTED_LINUX) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","linux","x64","kaine-ci-linux"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Run audit (high and critical)
        # Fails the job on high/critical advisories (pnpm audit exit non-zero).
        # To suppress a known false positive, use pnpm's audit config
        # (e.g. package.json "pnpm"."auditConfig"."ignoreCves") and document the
        # reason in the PR that adds the ignore entry.
        run: pnpm audit --audit-level high

  secret-scan:
    name: Secret Scan
    runs-on: ${{ fromJSON(github.event.repository.visibility == 'private' && vars.CI_SELF_HOSTED_LINUX == 'true' && fromJSON(vars.CI_SELF_HOSTED_LINUX) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","linux","x64","kaine-ci-linux"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ci-pr.yml scans images only for pull requests, so main's Trivy alerts went
  # stale between manual runs (issue #506). Same categories as the PR upload,
  # so alerts for packages main no longer ships close. Report-only: the PR job
  # owns the CRITICAL gate.
  image-scan:
    name: Image Scan (${{ matrix.app }})
    runs-on: ${{ fromJSON(github.event.repository.visibility == 'private' && vars.CI_SELF_HOSTED_LINUX == 'true' && fromJSON(vars.CI_SELF_HOSTED_LINUX) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","linux","x64","kaine-ci-linux"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            dockerfile: Dockerfile.api
          - app: web
            dockerfile: Dockerfile.web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Same weekly key as ci-pr.yml and docker-cache.yml, so the scan sees this
      # week's OS upgrade layers and reuses main's cache.
      - name: Compute apt refresh key
        id: apt
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      # Read-only cache: docker-cache.yml owns writing main's scope.
      - name: Build ${{ matrix.app }} image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: APT_REFRESH=${{ steps.apt.outputs.week }}
          tags: local/${{ matrix.app }}:main
          load: true
          cache-from: type=gha,scope=${{ matrix.app }}

      - name: Scan ${{ matrix.app }} image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/${{ matrix.app }}:main
          format: sarif
          output: trivy-${{ matrix.app }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload Trivy SARIF
        if: |
          github.event.repository.visibility == 'public' ||
          vars.ENABLE_GITHUB_CODE_SCANNING == 'true'
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          sarif_file: trivy-${{ matrix.app }}.sarif
          category: trivy-${{ matrix.app }}
