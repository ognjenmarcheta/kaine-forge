name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_apps:
        description: >-
          Image deploys only (DEPLOY_SOURCE=image): apps to build and deploy at
          HEAD even when their release branch did not move, for example api,web.
          Use it for the first images, a redeploy, or a build a failed run lost.
        required: false
        default: ""

concurrency:
  # Queue, never cancel: release:apps pushes release/<app> branches sequentially.
  # Cancelling mid-loop leaves a split deploy pair (see issue #139).
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  PNPM_VERSION: "10.29.3"

jobs:
  release:
    name: Version and Release
    runs-on: ${{ fromJSON(github.event.repository.visibility == 'private' && vars.CI_SELF_HOSTED_LINUX == 'true' && fromJSON(vars.CI_SELF_HOSTED_LINUX) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","linux","x64","kaine-ci-linux"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 60
    outputs:
      images: ${{ steps.images.outputs.matrix }}
      # Desktop apps tagged at HEAD whose installers the OS jobs build and attach.
      installers: ${{ steps.installers.outputs.matrix }}
      # Apps whose image deploys build, as a JSON array: the release branches
      # this run moved, plus any a manual run names in deploy_apps.
      apps: ${{ steps.deploy-apps.outputs.apps }}
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: monorepo_dev
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d monorepo_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}

      # Per-task Turbo cache in the GitHub Actions cache, as in ci-pr.yml. GitHub
      # lets a PR branch read caches saved on main, so the tasks this job runs seed
      # the cache that every PR reuses.
      - name: Turbo remote cache
        uses: rharkor/caching-for-turbo@760158c05c47e7a764f78e9a22ca3b5a6ed8c52e # v2.5.2
        with:
          server-port: "0"

      - name: Prepare environment
        run: |
          cat << 'EOF' > .env
          DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/monorepo_dev
          ALLOW_LOCAL_DB_PUSH=true
          BETTER_AUTH_SECRET=ci-release-secret
          BETTER_AUTH_URL=http://localhost:4000
          API_PORT=4000
          API_URL=http://localhost:4000
          VITE_API_URL=http://localhost:4000
          VITE_GRAPHQL_URL=http://localhost:4000/graphql
          EXPO_PUBLIC_API_URL=http://localhost:4000
          EXPO_PUBLIC_GRAPHQL_URL=http://localhost:4000/graphql
          EOF

      # pretest:e2e downloads only the browser. Hosted images ship Chromium's
      # system libraries; self-hosted runners need them installed, as in CI PR.
      # On hosted runners --with-deps only re-runs apt-get, which took 7-15 min
      # on a slow mirror.
      - name: Install Playwright Chromium
        env:
          WITH_DEPS: ${{ runner.environment == 'self-hosted' && '--with-deps' || '' }}
        run: pnpm --filter @repo/e2e exec playwright install $WITH_DEPS chromium

      - name: Run quality gates
        run: |
          pnpm run check:ci
          pnpm run build:core
          pnpm run test:e2e

      # Graph-aware update of release/<app> branches for affected Docker apps.
      # Runs while the worktree is still clean and HEAD matches origin/main
      # (before changesets may open a version PR or commit publishes).
      # No-op when no deployable app is affected; fails the job on script errors.
      - name: Update deployable app release branches
        id: release-apps
        run: pnpm release:apps
        env:
          # checkout authenticates origin; push uses the job token (contents: write).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A manual run may name apps to build at HEAD whose release branch did
      # not move. Only at the tip of main: an older HEAD would deploy old code.
      - name: List apps for image deploys
        id: deploy-apps
        env:
          MOVED: ${{ steps.release-apps.outputs.apps }}
          REQUESTED: ${{ inputs.deploy_apps }}
        run: |
          set -euo pipefail
          at_tip=false
          [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ] && at_tip=true
          # shellcheck disable=SC2016 # Node, not the shell, expands the JS template literals.
          AT_TIP="$at_tip" node -e '
            const fs = require("node:fs");
            const apps = new Set(JSON.parse(process.env.MOVED || "[]"));
            const requested = (process.env.REQUESTED || "").split(",").map((app) => app.trim()).filter(Boolean);
            for (const app of requested) {
              if (!/^[a-z0-9-]+$/.test(app) || !fs.existsSync(`Dockerfile.${app}`)) {
                console.error(`deploy_apps: no Dockerfile.${app}`);
                process.exit(1);
              }
              if (process.env.AT_TIP === "true") apps.add(app);
              else console.log(`deploy_apps: HEAD is behind origin/main, so ${app} is left to the newer run`);
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `apps=${JSON.stringify([...apps])}\n`);
          '

      # changesets/action v2 pairs with Changesets CLI v3 (inputs were renamed in
      # v2). Tag push and GitHub releases stay in the explicit steps below, which
      # generate release notes; the action only versions or runs the tag script.
      - name: Version packages or publish tags
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version-script: pnpm run release:version
          publish-script: pnpm run release:publish
          pr-title: "chore(release): version packages"
          commit-message: "chore(release): version packages"
          push-git-tags: false
          create-github-releases: false
        env:
          # A version PR opened with the job token gets no `pull_request` workflow
          # runs, so its required checks never report. Set repository secret
          # RELEASE_PR_TOKEN (fine-grained PAT: Contents rw, Pull requests rw) to
          # have the PR trigger CI. Falls back to the job token when unset.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PR_TOKEN || secrets.GITHUB_TOKEN }}

      # Both steps below key on the tags at HEAD, not on the action's `published`
      # output: `changeset git-tag` only creates tags that are missing, pushing an
      # existing tag is a no-op, and `gh release view` skips existing releases.
      # A version-PR run has no tags at HEAD and both steps exit early.
      - name: Push release tags
        run: |
          set -euo pipefail
          TAGS="$(git tag --points-at HEAD)"
          if [ -z "$TAGS" ]; then
            echo "No release tags created on this commit."
            exit 0
          fi

          while IFS= read -r tag; do
            [ -n "$tag" ] && git push origin "refs/tags/$tag"
          done <<< "$TAGS"

      - name: Create GitHub Releases for tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAGS="$(git tag --points-at HEAD)"
          if [ -z "$TAGS" ]; then
            echo "No release tags found for GitHub release creation."
            exit 0
          fi

          while IFS= read -r tag; do
            if [ -z "$tag" ]; then
              continue
            fi

            if gh release view "$tag" >/dev/null 2>&1; then
              echo "GitHub release already exists for $tag"
            else
              gh release create "$tag" --title "$tag" --generate-notes
            fi
          done <<< "$TAGS"

      # Each top-level Dockerfile.<app> is a deployable app whose version tag is
      # @repo/<app>@<version>. publish-images builds one image per such tag at HEAD;
      # `[]` (no app tag, or a version-PR run) skips that job.
      - name: List app images to publish
        id: images
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016 # Node, not the shell, expands the JS template literals.
          git tag --points-at HEAD | node -e '
            const fs = require("node:fs");
            const images = fs.readFileSync(0, "utf8").split("\n").flatMap((tag) => {
              const match = /^@repo\/([a-z0-9-]+)@(.+)$/.exec(tag);
              return match && fs.existsSync(`Dockerfile.${match[1]}`)
                ? [{ app: match[1], version: match[2], tag }]
                : [];
            });
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify(images)}\n`);
          '

      # Desktop apps have no Dockerfile; their release carries installers instead.
      # scripts/release-desktop-apps.mjs names the apps and the workspace each one bundles from.
      - name: List desktop installers to publish
        id: installers
        run: |
          set -euo pipefail
          git tag --points-at HEAD | node scripts/release-desktop-apps.mjs >> "$GITHUB_OUTPUT"

  # Builds the tagged app image, gates it on the same Trivy CRITICAL scan as the
  # PR docker-images job, then pushes the scanned image to GHCR. Never runs for
  # pull requests (no trigger here), forks, other refs, or runs without app tags.
  publish-images:
    name: Publish Image (${{ matrix.app }})
    if: >-
      needs.release.outputs.images != '' &&
      needs.release.outputs.images != '[]' &&
      github.ref == 'refs/heads/main' &&
      !github.event.repository.fork
    runs-on: ${{ fromJSON(github.event.repository.visibility == 'private' && vars.CI_SELF_HOSTED_LINUX == 'true' && fromJSON(vars.CI_SELF_HOSTED_LINUX) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","linux","x64","kaine-ci-linux"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    needs: release
    # The only job with packages: write; it replaces the workflow-level grant.
    permissions:
      # Appends the digest to the GitHub Release notes and uploads the SBOM.
      contents: write
      # Pushes to ghcr.io with GITHUB_TOKEN.
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.release.outputs.images) }}
    env:
      APP: ${{ matrix.app }}
      VERSION: ${{ matrix.version }}
      TAG: ${{ matrix.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ matrix.tag }}

      # GHCR names must be lowercase: ghcr.io/<owner>/<repo>-<app>.
      - name: Compute image name and tags
        id: meta
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}-${APP}"
          {
            echo "image=$image"
            echo "tags<<EOF"
            echo "$image:$VERSION"
            echo "$image:sha-$(git rev-parse --short=7 HEAD)"
            echo "EOF"
            echo "revision=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Build, scan, and push ${{ matrix.app }} image
        id: push
        uses: ./.github/actions/app-image
        with:
          app: ${{ matrix.app }}
          tags: ${{ steps.meta.outputs.tags }}
          version: ${{ matrix.version }}
          revision: ${{ steps.meta.outputs.revision }}
          token: ${{ secrets.GITHUB_TOKEN }}

      # A re-run finds the digest already in the notes and leaves them as they are.
      - name: Record the digest in the summary and the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.meta.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2016 # The backticks are Markdown code spans.
          note="$(printf '### Container image\n\n- Image: `%s:%s`\n- Digest: `%s`\n- Pull: `docker pull %s@%s`\n' \
            "$IMAGE" "$VERSION" "$DIGEST" "$IMAGE" "$DIGEST")"
          echo "$note" >> "$GITHUB_STEP_SUMMARY"
          body="$(gh release view "$TAG" --json body --jq .body)"
          if grep -qF "$DIGEST" <<< "$body"; then
            echo "Release $TAG already lists $DIGEST"
          else
            gh release edit "$TAG" --notes "$(printf '%s\n\n%s\n' "$body" "$note")"
          fi

      # Reuses the Trivy binary and vulnerability DB from the gate above.
      - name: Generate SBOM for ${{ matrix.app }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output: sbom-${{ matrix.app }}.spdx.json
          skip-setup-trivy: true
          cache: false

      - name: Attach SBOM to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" "sbom-$APP.spdx.json" --clobber

  # Desktop installers for the tagged desktop apps (docs/desktop-installers.md,
  # ADR 0025). One job per OS, not a matrix over runners: the self-hosted
  # routing test reads runs-on per job. Each job uploads to the release of its tag.
  installers-linux:
    name: Desktop Installers (Linux)
    if: >-
      needs.release.outputs.installers != '' &&
      needs.release.outputs.installers != '[]' &&
      github.ref == 'refs/heads/main' &&
      !github.event.repository.fork
    runs-on: ${{ fromJSON(github.event.repository.visibility == 'private' && vars.CI_SELF_HOSTED_LINUX == 'true' && fromJSON(vars.CI_SELF_HOSTED_LINUX) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","linux","x64","kaine-ci-linux"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 90
    needs: release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.release.outputs.installers) }}
    env:
      APP: ${{ matrix.app }}
      VERSION: ${{ matrix.version }}
      TAG: ${{ matrix.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ matrix.tag }}

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Install the desktop system packages
        # Tauri's WebKitGTK stack plus the GPUI packages, so one job serves both apps.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils gcc g++ clang cmake lld libfontconfig-dev libwayland-dev libxkbcommon-x11-dev libx11-xcb-dev libssl-dev libzstd-dev libasound2-dev libvulkan1 mesa-vulkan-drivers libglib2.0-dev

      - name: Install the pinned Rust toolchain
        # rust-toolchain.toml names the channel; rustup installs it on first use.
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --no-modify-path
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup show active-toolchain
          cargo --version

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> .cargo-target"

      - name: Install cargo-packager
        # Pinned; Swatinem/rust-cache keeps ~/.cargo/bin, so a cached runner skips the build.
        shell: bash
        run: command -v cargo-packager >/dev/null 2>&1 || cargo install cargo-packager --locked --version 0.11.8

      - name: Build the ${{ matrix.app }} installers
        # The Turbo bundle task builds @repo/web first through the dependency edge.
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec turbo run build --filter="${{ matrix.workspace }}^..."
          pnpm --filter "${{ matrix.workspace }}" bundle

      - name: Attach the installers to the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNED: ${{ 'true' }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find .cargo-target -path '*/release/bundle/*' -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' \) | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No installers under .cargo-target/*/release/bundle" >&2
            exit 1
          fi
          printf 'Installer: %s\n' "${files[@]}" >> "$GITHUB_STEP_SUMMARY"
          gh release upload "$TAG" "${files[@]}" --clobber
          if [ "$SIGNED" != "true" ]; then
            note="Installers for ${RUNNER_OS} are unsigned: add the signing secrets (docs/desktop-installers.md) to sign them."
            body="$(gh release view "$TAG" --json body --jq .body)"
            if ! grep -qF "$note" <<< "$body"; then
              gh release edit "$TAG" --notes "$(printf '%s\n\n%s\n' "$body" "$note")"
            fi
          fi

  # Desktop installers for the tagged desktop apps (docs/desktop-installers.md,
  # ADR 0025). One job per OS, not a matrix over runners: the self-hosted
  # routing test reads runs-on per job. Each job uploads to the release of its tag.
  installers-macos:
    name: Desktop Installers (macOS)
    if: >-
      needs.release.outputs.installers != '' &&
      needs.release.outputs.installers != '[]' &&
      github.ref == 'refs/heads/main' &&
      !github.event.repository.fork
    runs-on: ${{ fromJSON(github.event.repository.visibility == 'private' && vars.CI_SELF_HOSTED_MACOS == 'true' && fromJSON(vars.CI_SELF_HOSTED_MACOS) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","macOS","kaine-ci-macos"]' || '["macos-latest"]') }}
    timeout-minutes: 90
    needs: release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.release.outputs.installers) }}
    env:
      APP: ${{ matrix.app }}
      VERSION: ${{ matrix.version }}
      TAG: ${{ matrix.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ matrix.tag }}

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Install the pinned Rust toolchain
        # rust-toolchain.toml names the channel; rustup installs it on first use.
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --no-modify-path
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup show active-toolchain
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo --version

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> .cargo-target"

      - name: Install cargo-packager
        # Pinned; Swatinem/rust-cache keeps ~/.cargo/bin, so a cached runner skips the build.
        shell: bash
        run: command -v cargo-packager >/dev/null 2>&1 || cargo install cargo-packager --locked --version 0.11.8

      - name: Build the ${{ matrix.app }} installers
        # The Turbo bundle task builds @repo/web first through the dependency edge.
        shell: bash
        # Tauri signs and notarizes when these secrets exist; without them the
        # installers are unsigned and the release notes say so.
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          pnpm exec turbo run build --filter="${{ matrix.workspace }}^..."
          pnpm --filter "${{ matrix.workspace }}" bundle ${{ matrix.macosArgs }}

      - name: Attach the installers to the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNED: ${{ secrets.APPLE_SIGNING_IDENTITY != '' }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find .cargo-target -path '*/release/bundle/*' -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' \) | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No installers under .cargo-target/*/release/bundle" >&2
            exit 1
          fi
          printf 'Installer: %s\n' "${files[@]}" >> "$GITHUB_STEP_SUMMARY"
          gh release upload "$TAG" "${files[@]}" --clobber
          if [ "$SIGNED" != "true" ]; then
            note="Installers for ${RUNNER_OS} are unsigned: add the signing secrets (docs/desktop-installers.md) to sign them."
            body="$(gh release view "$TAG" --json body --jq .body)"
            if ! grep -qF "$note" <<< "$body"; then
              gh release edit "$TAG" --notes "$(printf '%s\n\n%s\n' "$body" "$note")"
            fi
          fi

  # Desktop installers for the tagged desktop apps (docs/desktop-installers.md,
  # ADR 0025). One job per OS, not a matrix over runners: the self-hosted
  # routing test reads runs-on per job. Each job uploads to the release of its tag.
  installers-windows:
    name: Desktop Installers (Windows)
    if: >-
      needs.release.outputs.installers != '' &&
      needs.release.outputs.installers != '[]' &&
      github.ref == 'refs/heads/main' &&
      !github.event.repository.fork
    runs-on: windows-latest
    timeout-minutes: 90
    needs: release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.release.outputs.installers) }}
    env:
      APP: ${{ matrix.app }}
      VERSION: ${{ matrix.version }}
      TAG: ${{ matrix.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ matrix.tag }}

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Install the pinned Rust toolchain
        # rust-toolchain.toml names the channel; rustup installs it on first use.
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --no-modify-path
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          rustup show active-toolchain
          cargo --version

      - name: Cache Cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ". -> .cargo-target"

      - name: Install cargo-packager
        # Pinned; Swatinem/rust-cache keeps ~/.cargo/bin, so a cached runner skips the build.
        shell: bash
        run: command -v cargo-packager >/dev/null 2>&1 || cargo install cargo-packager --locked --version 0.11.8

      - name: Build the ${{ matrix.app }} installers
        # The Turbo bundle task builds @repo/web first through the dependency edge.
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec turbo run build --filter="${{ matrix.workspace }}^..."
          pnpm --filter "${{ matrix.workspace }}" bundle

      - name: Attach the installers to the GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNED: ${{ 'false' }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find .cargo-target -path '*/release/bundle/*' -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.dmg' -o -name '*.msi' -o -name '*-setup.exe' \) | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No installers under .cargo-target/*/release/bundle" >&2
            exit 1
          fi
          printf 'Installer: %s\n' "${files[@]}" >> "$GITHUB_STEP_SUMMARY"
          gh release upload "$TAG" "${files[@]}" --clobber
          if [ "$SIGNED" != "true" ]; then
            note="Installers for ${RUNNER_OS} are unsigned: add the signing secrets (docs/desktop-installers.md) to sign them."
            body="$(gh release view "$TAG" --json body --jq .body)"
            if ! grep -qF "$note" <<< "$body"; then
              gh release edit "$TAG" --notes "$(printf '%s\n\n%s\n' "$body" "$note")"
            fi
          fi

  # Image deploys (docs/deploy.md, "Deploy source"). Off unless the repository
  # variable DEPLOY_SOURCE is `image`; by default the platform builds each
  # release/<app> branch itself. For each app whose branch this run moved, it
  # builds and scans the image, pushes `:sha-<7>` and the moving `:release`
  # tag, and calls the app's deploy webhook when its secret is set.
  deploy-images:
    name: Deploy Image (${{ matrix.app }})
    # !cancelled(): a later release step that fails (versioning, tags) must not
    # strand an app whose branch already moved; a rerun would not move it again.
    if: >-
      !cancelled() &&
      vars.DEPLOY_SOURCE == 'image' &&
      needs.release.outputs.apps != '' &&
      needs.release.outputs.apps != '[]' &&
      github.ref == 'refs/heads/main' &&
      !github.event.repository.fork
    runs-on: ${{ fromJSON(github.event.repository.visibility == 'private' && vars.CI_SELF_HOSTED_LINUX == 'true' && fromJSON(vars.CI_SELF_HOSTED_LINUX) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","linux","x64","kaine-ci-linux"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    needs: release
    permissions:
      contents: read
      # Pushes to ghcr.io with GITHUB_TOKEN.
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.release.outputs.apps) }}
    env:
      APP: ${{ matrix.app }}
    steps:
      # release:apps moved release/<app> to this run's commit.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute image name and tags
        id: meta
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}-${APP}"
          sha="sha-$(git rev-parse --short=7 HEAD)"
          {
            echo "image=$image"
            echo "sha=$sha"
            echo "tags<<EOF"
            echo "$image:$sha"
            echo "$image:release"
            echo "EOF"
            echo "revision=$(git rev-parse HEAD)"
          } >> "$GITHUB_OUTPUT"

      - name: Build, scan, and push ${{ matrix.app }} image
        id: push
        uses: ./.github/actions/app-image
        with:
          app: ${{ matrix.app }}
          tags: ${{ steps.meta.outputs.tags }}
          version: ${{ steps.meta.outputs.sha }}
          revision: ${{ steps.meta.outputs.revision }}
          token: ${{ secrets.GITHUB_TOKEN }}

      # DEPLOY_WEBHOOK_<APP>: the platform's deploy hook for the app, which
      # pulls `:release` and restarts it. Without one, the platform pulls on its
      # own schedule. Each secret is named here, not looked up by app name: a
      # dynamic lookup hands every repository secret to the runner. A new
      # deployable app adds its secret to this expression.
      - name: Trigger the ${{ matrix.app }} deploy
        env:
          WEBHOOK: >-
            ${{
              matrix.app == 'api' && secrets.DEPLOY_WEBHOOK_API ||
              matrix.app == 'web' && secrets.DEPLOY_WEBHOOK_WEB ||
              ''
            }}
          IMAGE: ${{ steps.meta.outputs.image }}
          SHA: ${{ steps.meta.outputs.sha }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          echo "Pushed \`$IMAGE:$SHA\` and \`$IMAGE:release\` (\`$DIGEST\`)." >> "$GITHUB_STEP_SUMMARY"
          app_upper="$(tr '[:lower:]-' '[:upper:]_' <<< "$APP")"
          if [ -z "$WEBHOOK" ]; then
            echo "No DEPLOY_WEBHOOK_${app_upper} secret: the platform pulls \`:release\` itself." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          curl --fail --silent --show-error --retry 3 --max-time 30 -X POST "$WEBHOOK" > /dev/null
          echo "Deploy webhook for $APP called." >> "$GITHUB_STEP_SUMMARY"
