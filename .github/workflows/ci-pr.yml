name: CI PR

on:
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  PNPM_VERSION: "10.29.3"

jobs:
  changeset-required:
    name: Changeset Required
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect source and changeset files
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            source:
              - "apps/**"
              - "packages/**"
              - "tooling/**"
            changeset:
              - ".changeset/*.md"

      - name: Enforce release metadata
        if: |
          steps.changes.outputs.source == 'true' &&
          steps.changes.outputs.changeset == 'false' &&
          !contains(github.event.pull_request.labels.*.name, 'release:skip-changeset')
        run: |
          echo "Source changes detected without a .changeset entry."
          echo "Run 'pnpm changeset' and commit the generated file,"
          echo "or add label 'release:skip-changeset' for non-releasable changes."
          exit 1

  check-fast:
    name: Check Fast
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: AI tooling doctor
        run: pnpm run ai:doctor

      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Coverage threshold
        run: pnpm run coverage

  graphql-schema:
    name: GraphQL Schema Compatibility
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Regenerate GraphQL artifacts and fail on drift
        env:
          # schema:generate imports feature modules that load the DB client at
          # module scope; a placeholder URL is enough (no live Postgres required).
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/monorepo_dev
        run: |
          set -euo pipefail
          # Root generate: API schema.graphql + web/mobile client codegen.
          pnpm run generate
          git add --intent-to-add \
            apps/api/schema.graphql \
            apps/web/src/graphql/generated \
            apps/mobile/src/graphql/generated
          if ! git diff --exit-code -- \
            apps/api/schema.graphql \
            apps/web/src/graphql/generated \
            apps/mobile/src/graphql/generated; then
            echo "GraphQL artifacts are out of date or hand-edited."
            echo "Run 'pnpm generate' and commit the result."
            exit 1
          fi

      - name: Diff schema against pull request base
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch origin "$BASE_REF" --depth=1
          git show "origin/${BASE_REF}:apps/api/schema.graphql" > /tmp/base-schema.graphql
          # Fails the job on breaking changes; additive non-breaking changes pass.
          pnpm exec graphql-inspector diff /tmp/base-schema.graphql apps/api/schema.graphql

  build-core:
    name: Build Core Apps
    runs-on: ubuntu-latest
    needs: check-fast
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-build-core-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-build-core-${{ runner.os }}-

      - name: Build API and Web with dependencies
        run: pnpm run build:core

  docker-images:
    name: Docker Image Builds
    runs-on: ubuntu-latest
    needs: check-fast
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Docker-related paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            docker:
              - "Dockerfile.api"
              - "Dockerfile.web"
              - "apps/api/**"
              - "apps/web/**"
              - "packages/**"
              - "scripts/**"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "turbo.json"
              - "tsconfig.base.json"

      - name: Build API image
        if: steps.filter.outputs.docker == 'true' || github.event_name != 'pull_request'
        run: docker build -f Dockerfile.api -t kaine-forge-api:ci .

      - name: Build web image
        if: steps.filter.outputs.docker == 'true' || github.event_name != 'pull_request'
        run: docker build -f Dockerfile.web -t kaine-forge-web:ci .

      - name: Skip note
        if: steps.filter.outputs.docker != 'true' && github.event_name == 'pull_request'
        run: echo "No Docker-related paths changed; skipping image builds."
  e2e-web-api:
    name: E2E Web/API
    runs-on: ubuntu-latest
    needs: build-core
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: monorepo_dev
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d monorepo_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Restore-only: build-core (needs:) already saved the exact-sha key.
      # This step and the build must stay BEFORE "Prepare environment" —
      # turbo hashes .env* as build inputs, so creating .env first would
      # change task hashes and defeat the cache hit.
      - name: Restore Turbo cache
        uses: actions/cache/restore@v4
        with:
          path: .turbo/cache
          key: turbo-build-core-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-build-core-${{ runner.os }}-

      - name: Build API and Web with dependencies
        run: pnpm run build:core

      - name: Install Playwright browser
        run: pnpm --filter @repo/e2e exec playwright install --with-deps chromium

      - name: Prepare environment
        run: |
          cat << 'EOF' > .env
          DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/monorepo_dev
          BETTER_AUTH_SECRET=ci-e2e-secret
          BETTER_AUTH_URL=http://localhost:4000
          API_PORT=4000
          API_URL=http://localhost:4000
          VITE_API_URL=http://localhost:4000
          VITE_GRAPHQL_URL=http://localhost:4000/graphql
          EXPO_PUBLIC_API_URL=http://localhost:4000
          EXPO_PUBLIC_GRAPHQL_URL=http://localhost:4000/graphql
          EOF

      - name: Prepare database schema and seed
        run: |
          pnpm run db:push
          pnpm run db:seed

      - name: Run Playwright e2e
        run: pnpm run test:e2e

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/e2e/playwright-report
            apps/e2e/test-results
