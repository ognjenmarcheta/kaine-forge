name: CI PR

on:
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  PNPM_VERSION: "10.29.3"
  # Optional remote Turbo cache — no-ops when secrets/vars are unset.
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  detect-paths:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docker: ${{ steps.filter.outputs.docker }}
      graphql: ${{ steps.filter.outputs.graphql }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Path filters
        id: filter
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3
        with:
          filters: |
            code:
              - "apps/**"
              - "packages/**"
              - "tooling/**"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "turbo.json"
              - "tsconfig.base.json"
              - "vitest*.ts"
              - "eslint.config.mjs"
              - "scripts/**"
            docker:
              - "Dockerfile.api"
              - "Dockerfile.web"
              - "apps/api/**"
              - "apps/web/**"
              - "packages/**"
              - "scripts/**"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "turbo.json"
              - "tsconfig.base.json"
            graphql:
              - "apps/api/src/features/**"
              - "apps/api/src/schema/**"
              - "apps/api/schema.graphql"
              - "apps/web/src/graphql/**"
              - "apps/mobile/src/graphql/**"
              - "tooling/graphql-codegen/**"
            mobile:
              - "apps/mobile/**"
              - "packages/mobile-ui/**"
              - "packages/config/tailwind/**"
              - "scripts/sync-mobile-design-tokens.mjs"

  changeset-required:
    name: Changeset Required
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Detect source and changeset files
        id: changes
        uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3
        with:
          filters: |
            source:
              - "apps/**"
              - "packages/**"
              - "tooling/**"
            changeset:
              - ".changeset/*.md"

      - name: Enforce release metadata
        if: |
          steps.changes.outputs.source == 'true' &&
          steps.changes.outputs.changeset == 'false' &&
          !contains(github.event.pull_request.labels.*.name, 'release:skip-changeset')
        run: |
          echo "Source changes detected without a .changeset entry."
          echo "Run 'pnpm changeset' and commit the generated file,"
          echo "or add label 'release:skip-changeset' for non-releasable changes."
          exit 1

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Diff-based advisory scan of the dependencies this PR introduces. Unlike a
      # full `pnpm audit`, it only flags deps the PR adds or changes, so an
      # unrelated newly-published advisory does not fail an unrelated PR. Needs
      # the GitHub Dependency Graph: enabled by default for public repos; requires
      # GitHub Advanced Security on private repos.
      - name: Dependency review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: high

  check-fast:
    name: Check Fast
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Needed for turbo --filter=...[base] affected computation on PRs.
          fetch-depth: 0

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}

      # Turbo cache entries are content-addressed by task hash (<hash>.tar.zst), so
      # every job can safely share one restore pool. The save key stays unique per
      # job and commit — GitHub cache entries are immutable, so a shared save key
      # would make every job after the first fail to save. The shared
      # `turbo-${{ runner.os }}-` restore prefix is the point: check-fast now reuses
      # artifacts built by build-core and vice versa. Two namespaces stored the same
      # artifacts twice and halved the hit rate against the repo's 10 GB cache cap.
      - name: Restore Turbo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-check-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: AI tooling doctor
        run: pnpm run ai:doctor

      - name: Quality gates (affected packages)
        env:
          # Some API modules import the DB client at load time during tests/coverage.
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/monorepo_dev
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="${{ github.base_ref }}"
            git fetch origin "$BASE_REF" --depth=1
            FILTER="...[origin/${BASE_REF}]"
            echo "Running turbo tasks for affected filter: $FILTER"
            pnpm exec turbo run format:check lint typecheck test --filter="$FILTER" --continue
            # Root AI package checks are not turbo workspace packages.
            pnpm run ai:lint
            pnpm run ai:typecheck
            pnpm run ai:test
          else
            echo "Non-PR event: running full quality gates (includes ai:*)"
            pnpm run format:check
            pnpm run lint
            pnpm run typecheck
            pnpm run test
          fi
          # Whole-graph contract checks: not affected-scopable; previously only
          # ran on Release after merge (see issue #142).
          pnpm run boundaries
          pnpm run knip

  coverage:
    name: Coverage Threshold
    # Full-repo vitest run with global + per-path floors. It is deliberately a
    # separate job rather than a step in check-fast: it cannot be affected-scoped
    # (thresholds are computed across all projects), so serializing it behind the
    # affected gate made the fast gate as slow as the whole test suite.
    if: |
      always() &&
      (github.event_name != 'pull_request' || needs.detect-paths.outputs.code == 'true')
    needs: detect-paths
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Coverage threshold
        env:
          # Some API modules import the DB client at load time during tests/coverage.
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/monorepo_dev
        run: pnpm run coverage

  mobile-typecheck:
    name: Mobile Typecheck
    # Independent of check-fast: no shared artifact/cache; parallelize (issue #144).
    if: |
      always() &&
      (github.event_name != 'pull_request' || needs.detect-paths.outputs.mobile == 'true')
    needs: [detect-paths]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Typecheck mobile and mobile-ui
        run: |
          pnpm --filter @repo/mobile-ui typecheck
          pnpm --filter @repo/mobile typecheck

  graphql-schema:
    name: GraphQL Schema Compatibility
    if: |
      github.event_name == 'pull_request' &&
      needs.detect-paths.outputs.graphql == 'true'
    needs: detect-paths
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Regenerate GraphQL artifacts and fail on drift
        env:
          # schema:generate imports feature modules that load the DB client at
          # module scope; a placeholder URL is enough (no live Postgres required).
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/monorepo_dev
        run: |
          set -euo pipefail
          # Root generate: API schema.graphql + web/mobile client codegen.
          pnpm run generate
          git add --intent-to-add \
            apps/api/schema.graphql \
            apps/web/src/graphql/generated \
            apps/mobile/src/graphql/generated
          if ! git diff --exit-code -- \
            apps/api/schema.graphql \
            apps/web/src/graphql/generated \
            apps/mobile/src/graphql/generated; then
            echo "GraphQL artifacts are out of date or hand-edited."
            echo "Run 'pnpm generate' and commit the result."
            exit 1
          fi

      - name: Diff schema against pull request base
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch origin "$BASE_REF" --depth=1
          git show "origin/${BASE_REF}:apps/api/schema.graphql" > /tmp/base-schema.graphql
          # Fails the job on breaking changes; additive non-breaking changes pass.
          pnpm exec graphql-inspector diff /tmp/base-schema.graphql apps/api/schema.graphql

  build-core:
    name: Build Core Apps
    # Skip pure docs/AI PRs; always run outside pull_request (merge queue / dispatch).
    if: |
      always() &&
      needs.check-fast.result == 'success' &&
      (github.event_name != 'pull_request' || needs.detect-paths.outputs.code == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [check-fast, detect-paths]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Restore Turbo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-build-core-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Build API and Web with dependencies
        run: pnpm run build:core

  docker-images:
    name: Docker Image (${{ matrix.app }})
    # Independent of check-fast: Buildx-only, own layer cache (issue #144).
    if: |
      always() &&
      (github.event_name != 'pull_request' || needs.detect-paths.outputs.docker == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [detect-paths]
    permissions:
      contents: read
      # Trivy uploads SARIF to the Security tab.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            dockerfile: Dockerfile.api
          - app: web
            dockerfile: Dockerfile.web
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build ${{ matrix.app }} image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          tags: kaine-forge-${{ matrix.app }}:ci
          load: true
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

      # Scans the image that was just built, not a registry copy, so a
      # vulnerability introduced by this PR's base image or apt layers is caught
      # before the release branch moves.
      - name: Scan ${{ matrix.app }} image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kaine-forge-${{ matrix.app }}:ci
          format: sarif
          output: trivy-${{ matrix.app }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4
        with:
          sarif_file: trivy-${{ matrix.app }}.sarif
          category: trivy-${{ matrix.app }}

      # Base images are pinned by digest (Dockerfile.*); a CRITICAL finding here
      # is actionable on this PR rather than ambient base-image churn (issue #155).
      - name: Fail on fixable CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: kaine-forge-${{ matrix.app }}:ci
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Generate SBOM for ${{ matrix.app }}
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: kaine-forge-${{ matrix.app }}:ci
          format: spdx-json
          artifact-name: sbom-${{ matrix.app }}.spdx.json
          output-file: sbom-${{ matrix.app }}.spdx.json

  e2e-web-api:
    name: E2E Web/API (shard ${{ matrix.shard }}/2)
    if: |
      always() &&
      needs.build-core.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build-core
    strategy:
      # Sharded across jobs, not workers: the specs share one seeded user, so
      # intra-job parallelism races on active-organization state (see
      # apps/e2e/playwright.config.ts). Each shard gets its own Postgres service,
      # so shards are isolated. Sized at 2 because there are only 5 spec files and
      # every shard re-pays install + build:core + browser install + db seed;
      # raise it here and in --shard= together when the suite grows.
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: monorepo_dev
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d monorepo_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}

      # Restore-only: build-core (needs:) already saved this exact key, and both
      # shards read it. This step and the build must stay BEFORE "Prepare
      # environment" — turbo hashes .env* as build inputs, so creating .env first
      # would change task hashes and defeat the cache hit.
      - name: Restore Turbo cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-build-core-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Build API and Web with dependencies
        run: pnpm run build:core

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browser
        run: pnpm --filter @repo/e2e exec playwright install --with-deps chromium

      - name: Prepare environment
        run: |
          cat << 'EOF' > .env
          DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/monorepo_dev
          BETTER_AUTH_SECRET=ci-e2e-secret
          BETTER_AUTH_URL=http://localhost:4000
          API_PORT=4000
          API_URL=http://localhost:4000
          VITE_API_URL=http://localhost:4000
          VITE_GRAPHQL_URL=http://localhost:4000/graphql
          EXPO_PUBLIC_API_URL=http://localhost:4000
          EXPO_PUBLIC_GRAPHQL_URL=http://localhost:4000/graphql
          EOF

      - name: Prepare database schema and seed
        run: |
          pnpm run db:push
          pnpm run db:seed

      # Invoked directly rather than via `pnpm run test:e2e` so this shard's
      # --shard flag reaches playwright. The root script also re-runs
      # db:ensure/db:push/db:seed, which the previous step already did.
      - name: Run Playwright e2e
        run: |
          pnpm --filter @repo/e2e exec playwright test \
            --shard=${{ matrix.shard }}/2 \
            --reporter=blob

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-blob-${{ matrix.shard }}
          path: apps/e2e/blob-report
          retention-days: 7

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-traces-${{ matrix.shard }}
          path: apps/e2e/test-results
          retention-days: 7

  e2e-report:
    name: E2E Report
    # Merges every shard's blob report into one browsable HTML report. Runs even
    # when a shard failed, since that is exactly when the report is wanted.
    if: always() && needs.e2e-web-api.result != 'skipped'
    needs: e2e-web-api
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Download shard blob reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: apps/e2e/all-blobs
          pattern: e2e-blob-*
          merge-multiple: true

      - name: Merge into HTML report
        run: |
          pnpm --filter @repo/e2e exec playwright merge-reports \
            --reporter=html \
            ./all-blobs
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report

      - name: Upload merged report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-report
          path: apps/e2e/playwright-report
          retention-days: 7
