name: CI PR

on:
  pull_request:
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  PNPM_VERSION: "10.29.3"

jobs:
  detect-paths:
    name: Detect Changed Paths
    runs-on: ${{ fromJSON(github.event.repository.visibility == 'private' && vars.CI_SELF_HOSTED_LINUX == 'true' && fromJSON(vars.CI_SELF_HOSTED_LINUX) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","linux","x64","kaine-ci-linux"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docker: ${{ steps.filter.outputs.docker }}
      graphql: ${{ steps.filter.outputs.graphql }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Path filters
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v3
        with:
          filters: |
            code:
              - "apps/**"
              - "packages/**"
              - "tooling/**"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "turbo.json"
              - "tsconfig.base.json"
              - "vitest*.ts"
              - "eslint.config.mjs"
              - "scripts/**"
              # Doc contracts live in vitest: monorepo-alignment.test.ts reads
              # MONOREPO_GUIDE.md and design-system.contract.test.ts reads
              # DESIGN_SYSTEM.md. Doc-only PRs must still run the coverage job
              # or the exact tests policing these files are skipped.
              - "MONOREPO_GUIDE.md"
              - "DESIGN_SYSTEM.md"
            docker:
              - "Dockerfile.api"
              - "Dockerfile.web"
              - "apps/api/**"
              - "apps/web/**"
              - "packages/**"
              - "scripts/**"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - ".npmrc"
              - "turbo.json"
              - "tsconfig.base.json"
            graphql:
              - "apps/api/src/features/**"
              - "apps/api/src/schema/**"
              - "apps/api/schema.graphql"
              - "apps/web/src/graphql/**"
              - "apps/mobile/src/graphql/**"
              - "tooling/graphql-codegen/**"
            mobile:
              - "apps/mobile/**"
              - "packages/mobile-ui/**"
              - "packages/config/tailwind/**"
              - "scripts/sync-mobile-design-tokens.mjs"
              # Metro resolves @repo/* to package source through tsconfig paths, so
              # any shared package or dependency change can break the mobile
              # bundle (issue #305: a storage barrel pulled @aws-sdk into Expo).
              - "packages/**"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - "tsconfig.base.json"

  changeset-required:
    name: Changeset Required
    if: github.event_name == 'pull_request'
    runs-on: ${{ fromJSON(github.event.repository.visibility == 'private' && vars.CI_SELF_HOSTED_LINUX == 'true' && fromJSON(vars.CI_SELF_HOSTED_LINUX) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","linux","x64","kaine-ci-linux"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect source and changeset files
        id: changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v3
        with:
          filters: |
            source:
              - "apps/**"
              - "packages/**"
              - "tooling/**"
            changeset:
              - ".changeset/*.md"

      # Labels are read live, not from github.event: Dependabot applies
      # release:skip-changeset seconds after the `opened` event, so that payload
      # lacks it, and a re-run replays the same payload.
      - name: Enforce release metadata
        if: |
          steps.changes.outputs.source == 'true' &&
          steps.changes.outputs.changeset == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" --jq '.[].name' \
            | grep -qx 'release:skip-changeset'; then
            echo "Label 'release:skip-changeset' present; no changeset required."
            exit 0
          fi
          echo "Source changes detected without a .changeset entry."
          echo "Run 'pnpm changeset' and commit the generated file,"
          echo "or add label 'release:skip-changeset' for non-releasable changes."
          exit 1

  dependency-review:
    name: Dependency Review
    # Public: free Dependency Graph. Private: needs GHAS + opt-in variable.
    # Without it this job is skipped and pnpm audit + Trivy carry the gate.
    if: |
      github.event_name == 'pull_request' &&
      (github.event.repository.visibility == 'public' ||
       vars.ENABLE_GITHUB_CODE_SCANNING == 'true')
    runs-on: ${{ fromJSON(github.event.repository.visibility == 'private' && vars.CI_SELF_HOSTED_LINUX == 'true' && fromJSON(vars.CI_SELF_HOSTED_LINUX) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","linux","x64","kaine-ci-linux"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Diff-based advisory scan of the dependencies this PR introduces. Unlike a
      # full `pnpm audit`, it only flags deps the PR adds or changes, so an
      # unrelated newly-published advisory does not fail an unrelated PR. Needs
      # the GitHub Dependency Graph: free for public repos; private needs GitHub
      # Advanced Security. Opt in with Actions variable ENABLE_GITHUB_CODE_SCANNING.
      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v4
        with:
          fail-on-severity: high

  check-fast:
    name: Check Fast
    runs-on: ${{ fromJSON(github.event.repository.visibility == 'private' && vars.CI_SELF_HOSTED_LINUX == 'true' && fromJSON(vars.CI_SELF_HOSTED_LINUX) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","linux","x64","kaine-ci-linux"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Needed for turbo --filter=...[base] affected computation on PRs.
          fetch-depth: 0

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}

      # Turbo remote cache backed by the GitHub Actions cache: one cache entry per
      # task hash, so any job reuses any task another job or main already ran. The
      # former single .turbo/cache blob per job restored whichever job saved last
      # and hit 0 of 29 lint/typecheck tasks. The action sets TURBO_API,
      # TURBO_TOKEN, and TURBO_TEAM for later steps; port 0 avoids a clash on
      # shared self-hosted hosts.
      - name: Turbo remote cache
        uses: rharkor/caching-for-turbo@760158c05c47e7a764f78e9a22ca3b5a6ed8c52e # v2.5.2
        with:
          server-port: "0"

      - name: AI tooling doctor
        # --strict fails on drift in committed AI docs (AGENTS.md, CLAUDE.md,
        # REVIEW.md, .serena/memories); local-install drift stays advisory.
        run: pnpm run ai:doctor -- --strict

      # Conventional Commits and the no-ai-coauthor rule are otherwise enforced
      # only by the local commit-msg hook, which --no-verify and GitHub web-UI
      # commits bypass. The PR title matters because squash merges use it as the
      # commit subject on main. Title and shas go through env, never inlined
      # into the script (untrusted input).
      - name: Commitlint (PR title and commits)
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          printf '%s\n' "$PR_TITLE" | pnpm exec commitlint
          pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA"

      - name: Quality gates (affected packages)
        env:
          # Some API modules import the DB client at load time during tests/coverage.
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/monorepo_dev
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_REF="${{ github.base_ref }}"
            git fetch origin "$BASE_REF" --depth=1
            FILTER="...[origin/${BASE_REF}]"
            echo "Running turbo tasks for affected filter: $FILTER"
            # Workspace tests run once in the coverage job (issue #143 option a).
            # Keep format/lint/typecheck affected-scoped; do not re-run turbo test.
            pnpm exec turbo run format:check lint typecheck --filter="$FILTER" --continue
            # tooling/* workspaces are not coverage projects (vitest.coverage.config.ts),
            # so their tests run here, affected-scoped (issue #489). The exclusions keep
            # apps and packages tests in the coverage job only.
            pnpm exec turbo run test --filter="$FILTER" --filter='!./apps/*' --filter='!./packages/*' --continue
            # Root AI package checks and scripts/* tests run in the AI and Script
            # Checks job, beside this one.
          else
            echo "Non-PR event: running full workspace quality gates"
            pnpm exec turbo run format:check lint typecheck test --continue
          fi
          # Whole-graph contract checks: not affected-scopable; previously only
          # ran on Release after merge (see issue #142).
          pnpm run boundaries
          pnpm run knip

  ai-checks:
    name: AI and Script Checks
    # Root .ai/ package and scripts/* tests are not Turbo workspaces, so Turbo
    # cannot scope or cache them. They ran serially inside Check Fast (about 45 s);
    # a job of their own runs them in parallel. No path filter: .ai tests read
    # files outside .ai/ (Dockerfiles, apps/api), so a filter can skip a real failure.
    runs-on: ${{ fromJSON(github.event.repository.visibility == 'private' && vars.CI_SELF_HOSTED_LINUX == 'true' && fromJSON(vars.CI_SELF_HOSTED_LINUX) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","linux","x64","kaine-ci-linux"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: AI tooling and script tests
        run: |
          set -euo pipefail
          pnpm run ai:lint
          pnpm run ai:typecheck
          pnpm run ai:test
          # scripts/* tests are not under vitest.coverage.config.ts projects.
          # scripts/pr-quality-gate.test.mjs fails when this list differs from the
          # root "test" script or from the tracked scripts/*.test.mjs files.
          node --test scripts/pnpm.test.mjs scripts/db-local.test.mjs scripts/create-package.test.mjs scripts/doctor.test.mjs scripts/fix-esm-extensions.test.mjs scripts/no-ai-coauthor.test.mjs scripts/pr-quality-gate.test.mjs scripts/metro-assets.test.mjs scripts/ci-runners.test.mjs

  coverage:
    name: Coverage Threshold
    # Sole PR workspace-test + threshold gate (issue #143 option a). Thresholds
    # cannot be affected-scoped, so this stays a full-repo vitest run rather than
    # a turbo --filter task. Build first: most packages resolve siblings through
    # exports → dist (turbo test dependsOn ^build); coverage previously had no
    # build step and only worked when dist happened to exist or tests stayed local.
    if: |
      always() &&
      (github.event_name != 'pull_request' || needs.detect-paths.outputs.code == 'true')
    needs: detect-paths
    runs-on: ${{ fromJSON(github.event.repository.visibility == 'private' && vars.CI_SELF_HOSTED_LINUX == 'true' && fromJSON(vars.CI_SELF_HOSTED_LINUX) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","linux","x64","kaine-ci-linux"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}

      # Same per-task Turbo cache as Check Fast.
      - name: Turbo remote cache
        uses: rharkor/caching-for-turbo@760158c05c47e7a764f78e9a22ca3b5a6ed8c52e # v2.5.2
        with:
          server-port: "0"

      # Only packages emit the dist that vitest resolves via package exports.
      # Do not build desktop/mobile apps here — desktop runs Tauri/Rust and is
      # far heavier than unit tests need (apps already alias or use package dist).
      - name: Build workspace packages for coverage
        run: pnpm exec turbo run build --filter="./packages/*"

      # Default typecheck uses root paths → package src (fast dev). This gate
      # clears paths and resolves @repo/* through package exports → dist so a
      # missing export cannot typecheck green while failing at runtime (#148).
      - name: Typecheck against package exports
        run: pnpm run typecheck:exports:run

      - name: Coverage threshold
        env:
          # Some API modules import the DB client at load time during tests/coverage.
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/monorepo_dev
        run: pnpm run coverage

  mobile-typecheck:
    name: Mobile Typecheck
    # Independent of check-fast: no shared artifact/cache; parallelize (issue #144).
    if: |
      always() &&
      (github.event_name != 'pull_request' || needs.detect-paths.outputs.mobile == 'true')
    needs: [detect-paths]
    runs-on: ${{ fromJSON(github.event.repository.visibility == 'private' && vars.CI_SELF_HOSTED_LINUX == 'true' && fromJSON(vars.CI_SELF_HOSTED_LINUX) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","linux","x64","kaine-ci-linux"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Typecheck mobile and mobile-ui
        run: |
          pnpm --filter @repo/mobile-ui typecheck
          pnpm --filter @repo/mobile typecheck

  mobile-export:
    name: Mobile Export Validation
    # Typecheck cannot see what Metro bundles: a package barrel that re-exports a
    # Node-only module typechecks green and fails at `expo export` (issue #305).
    # Deep Checks runs the same export twice a week; this catches it on the PR.
    if: |
      always() &&
      (github.event_name != 'pull_request' || needs.detect-paths.outputs.mobile == 'true')
    needs: [detect-paths]
    runs-on: ${{ fromJSON(github.event.repository.visibility == 'private' && vars.CI_SELF_HOSTED_LINUX == 'true' && fromJSON(vars.CI_SELF_HOSTED_LINUX) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","linux","x64","kaine-ci-linux"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Export mobile bundle
        run: CI=1 EXPO_NO_WATCHMAN=1 pnpm --filter @repo/mobile exec expo export --platform ios --output-dir /tmp/mobile-export

  graphql-schema:
    name: GraphQL Schema Compatibility
    if: |
      github.event_name == 'pull_request' &&
      needs.detect-paths.outputs.graphql == 'true'
    needs: detect-paths
    runs-on: ${{ fromJSON(github.event.repository.visibility == 'private' && vars.CI_SELF_HOSTED_LINUX == 'true' && fromJSON(vars.CI_SELF_HOSTED_LINUX) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","linux","x64","kaine-ci-linux"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Regenerate GraphQL artifacts and fail on drift
        env:
          # schema:generate imports feature modules that load the DB client at
          # module scope; a placeholder URL is enough (no live Postgres required).
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/monorepo_dev
        run: |
          set -euo pipefail
          # Root generate: API schema.graphql + web/mobile client codegen.
          pnpm run generate
          git add --intent-to-add \
            apps/api/schema.graphql \
            apps/web/src/graphql/generated \
            apps/mobile/src/graphql/generated
          if ! git diff --exit-code -- \
            apps/api/schema.graphql \
            apps/web/src/graphql/generated \
            apps/mobile/src/graphql/generated; then
            echo "GraphQL artifacts are out of date or hand-edited."
            echo "Run 'pnpm generate' and commit the result."
            exit 1
          fi

      # The owner accepts an intended break with the graphql:breaking-approved
      # label, then re-runs this job. Labels are read live, like the changeset
      # gate: a re-run replays the original event payload, which lacks the label.
      - name: Diff schema against pull request base
        env:
          BASE_REF: ${{ github.base_ref }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git fetch origin "$BASE_REF" --depth=1
          git show "origin/${BASE_REF}:apps/api/schema.graphql" > /tmp/base-schema.graphql
          # Fails the job on breaking changes; additive non-breaking changes pass.
          if pnpm exec graphql-inspector diff /tmp/base-schema.graphql apps/api/schema.graphql; then
            exit 0
          fi
          if gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" --jq '.[].name' \
            | grep -x 'graphql:breaking-approved' >/dev/null; then
            echo "Label 'graphql:breaking-approved' present; the breaking changes above are accepted."
            exit 0
          fi
          echo "Breaking GraphQL schema changes need the owner's approval:"
          echo "add label 'graphql:breaking-approved' and re-run this job."
          exit 1

  build-core:
    name: Build Core Apps
    # Skip pure docs/AI PRs; always run outside pull_request (merge queue / dispatch).
    # Runs beside Check Fast, not after it: e2e only needs this build, and waiting
    # for lint and typecheck delayed e2e by 2.5-4.5 min. The PR Quality Gate still
    # needs every job, so a Check Fast failure still blocks the merge.
    if: |
      always() &&
      (github.event_name != 'pull_request' || needs.detect-paths.outputs.code == 'true')
    runs-on: ${{ fromJSON(github.event.repository.visibility == 'private' && vars.CI_SELF_HOSTED_LINUX == 'true' && fromJSON(vars.CI_SELF_HOSTED_LINUX) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","linux","x64","kaine-ci-linux"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 20
    needs: [detect-paths]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}

      # Same per-task Turbo cache as Check Fast.
      - name: Turbo remote cache
        uses: rharkor/caching-for-turbo@760158c05c47e7a764f78e9a22ca3b5a6ed8c52e # v2.5.2
        with:
          server-port: "0"

      - name: Build API and Web with dependencies
        run: pnpm run build:core

      # Share built package/app dist with e2e shards so they do not re-run
      # build:core (issue #145). API e2e resolves @repo/* through package
      # exports → dist even though the server process is started via tsx.
      - name: Upload core build outputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: core-dist
          path: |
            packages/*/dist
            apps/api/dist
            apps/web/dist
          if-no-files-found: error
          retention-days: 1

  docker-images:
    name: Docker Image (${{ matrix.app }})
    # Independent of check-fast: Buildx-only, own layer cache (issue #144).
    if: |
      always() &&
      (github.event_name != 'pull_request' || needs.detect-paths.outputs.docker == 'true')
    runs-on: ${{ fromJSON(github.event.repository.visibility == 'private' && vars.CI_SELF_HOSTED_LINUX == 'true' && fromJSON(vars.CI_SELF_HOSTED_LINUX) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","linux","x64","kaine-ci-linux"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    needs: [detect-paths]
    permissions:
      contents: read
      # Trivy uploads SARIF to the Security tab.
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api
            dockerfile: Dockerfile.api
          - app: web
            dockerfile: Dockerfile.web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ARC runners set BUILDKIT_HOST to a shared BuildKit daemon whose layer
      # cache persists on the host (docs/self-hosted-ci.md). There the build
      # skips the GitHub cache; elsewhere it uses a fresh builder and type=gha.
      - name: Detect shared BuildKit
        id: buildkit
        run: echo "endpoint=${BUILDKIT_HOST:-}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver: ${{ steps.buildkit.outputs.endpoint && 'remote' || 'docker-container' }}
          endpoint: ${{ steps.buildkit.outputs.endpoint }}

      # Weekly key for the OS upgrade layers in Dockerfile.api (apt) and Dockerfile.web (apk); docker-cache.yml computes the same.
      - name: Compute apt refresh key
        id: apt
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Build ${{ matrix.app }} image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: APT_REFRESH=${{ steps.apt.outputs.week }}
          tags: local/${{ matrix.app }}:ci
          load: true
          cache-from: ${{ !steps.buildkit.outputs.endpoint && format('type=gha,scope={0}', matrix.app) || '' }}
          cache-to: ${{ !steps.buildkit.outputs.endpoint && format('type=gha,mode=max,scope={0}', matrix.app) || '' }}

      # Scans the image that was just built, not a registry copy, so a
      # vulnerability introduced by this PR's base image or apt layers is caught
      # before the release branch moves.
      - name: Scan ${{ matrix.app }} image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/${{ matrix.app }}:ci
          format: sarif
          output: trivy-${{ matrix.app }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      # SARIF upload needs GitHub Code Scanning (same gate as CodeQL upload).
      # CRITICAL fail below still hard-gates repos without Code Scanning.
      - name: Upload Trivy SARIF
        if: |
          always() &&
          (github.event.repository.visibility == 'public' ||
           vars.ENABLE_GITHUB_CODE_SCANNING == 'true')
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          sarif_file: trivy-${{ matrix.app }}.sarif
          category: trivy-${{ matrix.app }}

      # Base images are pinned by digest (Dockerfile.*); a CRITICAL finding here
      # is actionable on this PR rather than ambient base-image churn (issue #155).
      # Second pass over the same image: reuse the binary, vulnerability DB and
      # image analysis the SARIF pass left in the shared cache-dir instead of
      # installing Trivy and restoring the DB cache again (about 25s on api).
      # One pass cannot serve both: `severity` applies to the whole run.
      - name: Fail on fixable CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/${{ matrix.app }}:ci
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true
          cache: false

      - name: Generate SBOM for ${{ matrix.app }}
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: local/${{ matrix.app }}:ci
          format: spdx-json
          artifact-name: sbom-${{ matrix.app }}.spdx.json
          output-file: sbom-${{ matrix.app }}.spdx.json

  e2e-web-api:
    name: E2E Web/API (shard ${{ matrix.shard }}/2)
    if: |
      always() &&
      needs.build-core.result == 'success'
    runs-on: ${{ fromJSON(github.event.repository.visibility == 'private' && vars.CI_SELF_HOSTED_LINUX == 'true' && fromJSON(vars.CI_SELF_HOSTED_LINUX) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","linux","x64","kaine-ci-linux"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 30
    needs: build-core
    strategy:
      # Sharded across jobs, not workers: the specs share one seeded user, so
      # intra-job parallelism races on active-organization state (see
      # apps/e2e/playwright.config.ts). Each shard gets its own Postgres service,
      # so shards are isolated. Sized at 2 because there are only 5 spec files and
      # each shard still re-pays install + browser install + db seed; build:core
      # is shared via the core-dist artifact (issue #145). Raise shard count
      # here and in --shard= together when the suite grows. Do not raise
      # playwright workers.
      fail-fast: false
      matrix:
        shard: [1, 2]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: monorepo_dev
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d monorepo_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}

      # Dist from build-core — do not re-run build:core on each shard (#145).
      - name: Download core build outputs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: core-dist
          path: .

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      # Hosted Ubuntu images ship Chromium's system libraries; only self-hosted
      # runners need --with-deps. Its apt-get step took 7-15 min in 7 of 21
      # recent shards on a slow mirror, against about 20 s without it. The e2e
      # screenshots are artifacts, not compared, so the extra fonts it installs
      # change no result.
      - name: Install Playwright browser
        env:
          WITH_DEPS: ${{ runner.environment == 'self-hosted' && '--with-deps' || '' }}
        run: pnpm --filter @repo/e2e exec playwright install $WITH_DEPS chromium

      - name: Prepare environment
        run: |
          cat << 'EOF' > .env
          DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/monorepo_dev
          BETTER_AUTH_SECRET=ci-e2e-secret
          BETTER_AUTH_URL=http://localhost:4000
          API_PORT=4000
          API_URL=http://localhost:4000
          VITE_API_URL=http://localhost:4000
          VITE_GRAPHQL_URL=http://localhost:4000/graphql
          EXPO_PUBLIC_API_URL=http://localhost:4000
          EXPO_PUBLIC_GRAPHQL_URL=http://localhost:4000/graphql
          EOF

      - name: Prepare database schema and seed
        run: |
          pnpm run db:push
          pnpm run db:seed

      # Invoked directly rather than via `pnpm run test:e2e` so this shard's
      # --shard flag reaches playwright. The root script also re-runs
      # db:ensure/db:push/db:seed, which the previous step already did.
      - name: Run Playwright e2e
        env:
          # Serve the downloaded core-dist builds (apps/e2e/playwright.config.ts).
          E2E_SERVE_BUILD: "true"
        run: |
          pnpm --filter @repo/e2e exec playwright test \
            --shard=${{ matrix.shard }}/2 \
            --reporter=blob

      - name: Upload blob report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-blob-${{ matrix.shard }}
          path: apps/e2e/blob-report
          retention-days: 7

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-traces-${{ matrix.shard }}
          path: apps/e2e/test-results
          retention-days: 7

  e2e-report:
    name: E2E Report
    # Merges every shard's blob report into one browsable HTML report. Runs even
    # when a shard failed, since that is exactly when the report is wanted.
    if: always() && needs.e2e-web-api.result != 'skipped'
    needs: e2e-web-api
    runs-on: ${{ fromJSON(github.event.repository.visibility == 'private' && vars.CI_SELF_HOSTED_LINUX == 'true' && fromJSON(vars.CI_SELF_HOSTED_LINUX) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","linux","x64","kaine-ci-linux"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Download shard blob reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: apps/e2e/all-blobs
          pattern: e2e-blob-*
          merge-multiple: true

      - name: Merge into HTML report
        run: |
          pnpm --filter @repo/e2e exec playwright merge-reports \
            --reporter=html \
            ./all-blobs
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report

      - name: Upload merged report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/e2e/playwright-report
          retention-days: 7

  pr-quality-gate:
    name: PR Quality Gate
    if: always()
    runs-on: ${{ fromJSON(github.event.repository.visibility == 'private' && vars.CI_SELF_HOSTED_LINUX == 'true' && fromJSON(vars.CI_SELF_HOSTED_LINUX) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && '["self-hosted","linux","x64","kaine-ci-linux"]' || '["ubuntu-latest"]') }}
    timeout-minutes: 5
    needs:
      - detect-paths
      - changeset-required
      - dependency-review
      - check-fast
      - ai-checks
      - coverage
      - mobile-typecheck
      - mobile-export
      - graphql-schema
      - build-core
      - docker-images
      - e2e-web-api
      - e2e-report
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify required job results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
          CODE_SCANNING_ENABLED: ${{ vars.ENABLE_GITHUB_CODE_SCANNING }}
        run: node scripts/pr-quality-gate.mjs
