packages:
  - "apps/*"
  - "packages/*"
  - "tooling/*"

# Shared third-party versions. Prefer `catalog:` in package.json over duplicated ranges.
# Mobile React Native pins live in the named `mobile` catalog (Expo SDK freezes).
catalog:
  # Runtime libraries shared across workspaces
  better-auth: "^1.6.25"
  "@better-auth/expo": "1.6.25"
  dotenv: "^17.4.2"
  drizzle-orm: "^0.45.2"
  graphql: "^16.14.2"
  graphql-request: "^7.4.0"
  graphql-ws: "^6.2.0"
  zod: "^4.4.3"
  zustand: "^5.0.14"
  "@tanstack/react-query": "^5.101.4"
  "@graphql-typed-document-node/core": "^3.2.0"
  class-variance-authority: "^0.7.1"
  clsx: "^2.1.1"
  tailwind-merge: "^3.6.0"
  sonner: "^2.0.7"
  # Web React DOM stack (caret ranges; mobile uses catalog:mobile)
  react: "^19.2.8"
  react-dom: "^19.2.8"
  "@types/react": "^19.2.17"
  "@types/react-dom": "^19.2.3"
  # Web Tailwind v4 (keep @tailwindcss/vite on the same minor line)
  tailwindcss: "^4.3.3"
  # Tooling
  typescript: "^5.9.2"
  # Keep vitest and its UI/coverage companions on the same version (peer deps).
  # 3.2.6+ clears CVE-2026-47429 (Trivy CRITICAL on API image).
  vitest: "3.2.6"
  "@vitest/coverage-v8": "3.2.6"
  "@vitest/ui": "3.2.6"
  prettier: "^3.9.6"
  "@types/node": "^24.3.0"

catalogs:
  # Expo SDK / React Native singleton graph — pin exactly; freezes paths (issue #198).
  # Pins track Expo SDK 55 bundledNativeModules (react-native 0.83.x, react 19.2).
  mobile:
    react: "19.2.0"
    react-dom: "19.2.0"
    "@types/react": "~19.2.0"
    "@types/react-dom": "~19.2.0"
    react-native: "0.83.10"
    nativewind: "4.2.1"
    react-native-css-interop: "0.2.1"
    react-native-reanimated: "4.2.1"
    react-native-safe-area-context: "5.6.2"
    react-native-worklets: "0.7.4"
    tailwindcss: "3.4.17"

# Force fixed versions for packages that Trivy flags as CRITICAL in the API image
# (optional better-auth peers + transitive CLI deps otherwise pin older releases).
# minimatch: historical override for transitive vulnerability pin.
overrides:
  minimatch: 10.2.1
  shell-quote: "^1.10.0"
  tar: "7.5.19"
  esbuild: "0.27.3"
  # Security floors for transitive Dependabot highs (GHSA fixes; 2026-08 triage).
  "@xmldom/xmldom": "^0.8.13"
  defu: "^6.1.5"
  "nanoid@3": "^3.3.18"
  node-forge: "^1.4.0"
  # Keep better-auth/expo peers on the Expo SDK 55 line (not random major peers).
  expo-constants: "~55.0.17"
  expo-linking: "~55.0.16"
  "@expo/metro-runtime": "~55.0.12"
