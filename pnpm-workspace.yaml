packages:
  - "apps/*"
  - "packages/*"
  - "tooling/*"

# Shared third-party versions. Prefer `catalog:` in package.json over duplicated ranges.
# Mobile React Native pins live in the named `mobile` catalog (Expo SDK freezes).
catalog:
  # Runtime libraries shared across workspaces
  better-auth: "^1.6.23"
  "@better-auth/expo": "1.6.23"
  dotenv: "^17.2.2"
  drizzle-orm: "^0.44.5"
  graphql: "^16.11.0"
  graphql-request: "^7.4.0"
  graphql-ws: "^6.0.7"
  zod: "^4.3.6"
  zustand: "^5.0.11"
  "@tanstack/react-query": "^5.90.21"
  "@graphql-typed-document-node/core": "^3.2.0"
  class-variance-authority: "^0.7.1"
  clsx: "^2.1.1"
  tailwind-merge: "^3.3.1"
  sonner: "^2.0.7"
  # Web React DOM stack (caret ranges; mobile uses catalog:mobile)
  react: "^19.1.1"
  react-dom: "^19.1.1"
  "@types/react": "^19.1.10"
  "@types/react-dom": "^19.1.7"
  # Web Tailwind v4
  tailwindcss: "^4.2.0"
  # Tooling
  typescript: "^5.9.2"
  # Keep vitest and its UI/coverage companions on the same version (peer deps).
  vitest: "3.2.4"
  "@vitest/coverage-v8": "3.2.4"
  "@vitest/ui": "3.2.4"
  prettier: "^3.7.4"
  "@types/node": "^24.3.0"

catalogs:
  # Expo SDK / React Native singleton graph — pin exactly; Renovate freezes these paths.
  mobile:
    react: "19.1.0"
    react-dom: "19.1.0"
    "@types/react": "~19.1.10"
    "@types/react-dom": "~19.1.11"
    react-native: "0.81.5"
    nativewind: "4.2.1"
    react-native-css-interop: "0.2.1"
    react-native-reanimated: "4.1.1"
    react-native-safe-area-context: "5.6.2"
    react-native-worklets: "0.5.1"
    tailwindcss: "3.4.17"

overrides:
  minimatch: 10.2.1
