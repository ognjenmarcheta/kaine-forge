packages:
  - "apps/*"
  - "packages/*"
  - "tooling/*"

# Shared third-party versions. Prefer `catalog:` in package.json over duplicated ranges.
# Mobile React Native pins live in the named `mobile` catalog (Expo SDK freezes).
catalog:
  # Runtime libraries shared across workspaces
  better-auth: "^1.7.3"
  "@better-auth/expo": "1.7.3"
  dotenv: "^17.4.2"
  drizzle-orm: "^0.45.2"
  graphql: "^16.14.2"
  graphql-request: "^7.4.0"
  graphql-ws: "^6.2.1"
  zod: "^4.5.4"
  zustand: "^5.0.15"
  "@tanstack/react-query": "^5.102.8"
  "@graphql-typed-document-node/core": "^3.2.0"
  class-variance-authority: "^0.7.1"
  clsx: "^2.1.1"
  tailwind-merge: "^3.6.0"
  sonner: "^2.0.8"
  # Web React DOM stack (caret ranges; mobile uses catalog:mobile)
  react: "^19.2.8"
  react-dom: "^19.2.8"
  "@types/react": "^19.2.18"
  "@types/react-dom": "^19.2.7"
  # Web Tailwind v4 (keep @tailwindcss/vite on the same minor line)
  tailwindcss: "^4.3.3"
  # Tooling
  typescript: "^5.9.2"
  # Keep vitest and its UI/coverage companions on the same version (peer deps);
  # monorepo-alignment pins the lockstep and Dependabot groups them (#324).
  # 4.x: v8 coverage uses AST-aware remapping and only reports files it loads
  # unless coverage.include is set; floors in vitest.coverage.config.ts are
  # baselined against that accounting (#329). Majors stay intentional.
  vitest: "4.1.11"
  "@vitest/coverage-v8": "4.1.11"
  "@vitest/ui": "4.1.11"
  prettier: "^3.9.6"
  "@types/node": "^24.3.0"

catalogs:
  # Expo SDK / React Native singleton graph — pin exactly; freezes paths (issue #198).
  # Pins track Expo SDK 55 bundledNativeModules (react-native 0.83.x, react 19.2).
  mobile:
    react: "19.2.0"
    react-dom: "19.2.0"
    "@types/react": "~19.2.0"
    "@types/react-dom": "~19.2.0"
    react-native: "0.83.10"
    nativewind: "4.2.1"
    react-native-css-interop: "0.2.1"
    react-native-reanimated: "4.2.1"
    react-native-safe-area-context: "5.6.2"
    react-native-worklets: "0.7.4"
    tailwindcss: "3.4.17"

# Release-age gate for every resolution pnpm performs here (pnpm >= 10.16).
# Dependabot applies its default 3-day cooldown to the final `pnpm install` as
# `--config.minimumReleaseAge=4320`, but the `pnpm update <dep>@<version>` it
# runs first is ungated and re-resolves every instance of that package
# (auto-installed peers included) to the newest release. A release younger than
# 3 days then fails the gated install with ERR_PNPM_NO_MATURE_MATCHING_VERSION
# and the npm job ends red (#356). The same window here gates both commands and
# local installs alike; Dependabot only overrides a repo gate shorter than its
# cooldown, so keep this equal to the Dependabot cooldown (3 days).
minimumReleaseAge: 4320 # minutes

# Force fixed versions for packages that Trivy flags as CRITICAL in the API image
# (optional better-auth peers + transitive CLI deps otherwise pin older releases).
overrides:
  # minimatch: transitive vulnerability floor. Caret, not an exact pin — the old
  # exact pin (10.2.1) became the vulnerable version itself (GHSA-23c5-xmqv-rm74).
  minimatch: "^10.2.3"
  shell-quote: "^1.10.0"
  tar: "7.5.19"
  esbuild: "0.27.3"
  # Security floors for transitive Dependabot highs (GHSA fixes; 2026-08 triage).
  "@xmldom/xmldom": "^0.8.15" # 2026-09-09: six GHSAs via expo>@expo/cli>@expo/plist (#258)
  defu: "^6.1.5"
  "nanoid@3": "^3.3.18"
  node-forge: "^1.4.0"
  # Security floors from the 2026-09 audit (issue #258). All transitive dev
  # tooling; caret ranges so later patches flow and the major stays put.
  # Selector `pkg@N` keeps the floor inside the major the dependent expects.
  "brace-expansion@5": "^5.0.9" # GHSA-rgw5-rvv9-x895 via @vitest/coverage-v8>test-exclude>minimatch
  browserslist: "^4.28.7" # GHSA-73wf-gq98-2v4g, GHSA-c83g-rgw3-j3cx via @graphql-inspector/cli>@babel/core
  "fast-uri@3": "^3.1.6" # GHSA-f65p-4m7j-42xc and four more via @commitlint/cli>…>ajv
  flatted: "^3.4.2" # GHSA-25h7-pfq9-p65f, GHSA-rf6f-7fwh-wjgh via @vitest/ui
  "js-yaml@3": "^3.15.1" # GHSA-52cp-r559-cp3m, GHSA-5p4m-2wfm-xmqj via @changesets/cli>@manypkg/get-packages
  "js-yaml@4": "^4.3.2" # same advisories + GHSA-2883-xcg3-v3hh via @commitlint/load>cosmiconfig and @changesets/parse
  postcss: "^8.5.18" # GHSA-6g55-p6wh-862q, GHSA-r28c-9q8g-f849 via vitest>vite
  "rollup@4": "^4.59.0" # GHSA-mw96-cpmx-2vgc via vitest>vite (web itself builds with vite 8 / rolldown)
  # vite 7 is only vitest's; parent-scoped so the floor does not rewrite peer
  # ranges elsewhere (a bare `vite@7` selector narrowed @tailwindcss/vite's
  # `^5||^6||^7||^8` peer to `^7.3.5` and left web's vite 8 "unmet").
  "vitest>vite": "^7.3.5" # GHSA-p9ff-h696-f583, GHSA-fx2h-pf6j-xcff, GHSA-v2wj-q39q-566r
  "@vitest/mocker>vite": "^7.3.5"
  # Keep better-auth/expo peers on the Expo SDK 55 line (not random major peers).
  expo-constants: "~55.0.17"
  expo-linking: "~55.0.16"
  "@expo/metro-runtime": "~55.0.12"

# pnpm audit ignores. Only for advisories with no patched release. Each entry
# names the path and the condition that removes it.
auditConfig:
  ignoreGhsas:
    # image-size <=2.0.2 (every published version) via expo>@expo/metro>metro;
    # no fixed release exists. Drop both when Expo ships a metro with image-size >2.0.2.
    - GHSA-5p2g-fcmc-qvqq
    - GHSA-w3rx-r6r6-pgpr
