# cargo-deny: licences, advisories, bans and sources for the Rust workspace.
# Run `cargo deny check` (installed with `cargo install cargo-deny --locked`).
[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
# Unmaintained crates deep inside the GPUI graph are the kit's to replace; only
# direct dependencies of the workspace crates fail here.
unmaintained = "workspace"
ignore = []

[licenses]
version = 2
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "0BSD",
  "MIT",
  "MIT-0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "BSL-1.0",
  "CC0-1.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "MPL-2.0",
  "OFL-1.1",
  "CDLA-Permissive-2.0",
  "OpenSSL",
]
confidence-threshold = 0.8
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
