query GetTodos($first: Int, $after: String) {
  todos(first: $first, after: $after) {
    items {
      id
      title
      description
      completed
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

mutation ToggleTodo($id: ID!) {
  toggleTodo(id: $id) {
    id
    title
    description
    completed
  }
}
