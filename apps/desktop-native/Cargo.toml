[package]
name = "kaine_forge_desktop_native"
version = "0.0.0"
description = "Kaine Forge native desktop app built with GPUI"
authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "kaine_forge_desktop_native"
path = "src/lib.rs"

[[bin]]
name = "kaine_forge_desktop_native"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
futures = { workspace = true }
gpui-kit = { workspace = true }
graphql_client = { workspace = true }
keyring = { workspace = true }
reqwest_client = { workspace = true }
rust-i18n = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sys-locale = { workspace = true }

[dev-dependencies]
gpui-kit = { workspace = true, features = ["test-support"] }

[lints]
workspace = true

# cargo-packager (docs/desktop-installers.md): name, version, description, authors
# and the binary come from this manifest; installers land beside the Tauri ones.
[package.metadata.packager]
# "Native" keeps the installers, app bundle and Debian package apart from the Tauri app's.
product-name = "Kaine Forge Native"
identifier = "com.kaine.forge.desktop-native"
category = "Utility"
icons = [
  "icons/32x32.png",
  "icons/128x128.png",
  "icons/128x128@2x.png",
  "icons/icon.icns",
  "icons/icon.ico",
]
out-dir = "../../.cargo-target/release/bundle/native"
