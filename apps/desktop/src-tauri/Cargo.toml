[package]
name = "kaine_forge_desktop"
version = "0.1.0"
description = "Kaine Forge desktop shell powered by Tauri"
authors = ["Kaine Forge"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.90"

[lib]
name = "kaine_forge_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
# Device databases for synced rows (ADR 0020); bundled, so no system SQLite is needed.
rusqlite = { version = "0.40", features = ["bundled", "hooks"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
