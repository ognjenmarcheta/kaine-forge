[package]
name = "kaine_forge_desktop"
version = "0.1.0"
description = "Kaine Forge desktop shell powered by Tauri"
authors = ["Kaine Forge"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "kaine_forge_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
