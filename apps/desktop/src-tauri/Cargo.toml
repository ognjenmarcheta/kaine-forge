[package]
name = "kaine_forge_desktop"
version = "1.2.1"
description = "Kaine Forge desktop shell powered by Tauri"
authors.workspace = true
license.workspace = true
# Kept at 2021 until a WebKitGTK machine proves the 2024 edition for this crate; the
# workspace and tauri 2.12 itself are 2024.
edition = "2021"
rust-version.workspace = true
publish.workspace = true

[lib]
name = "kaine_forge_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2", features = [] }
# Device databases for synced rows (ADR 0020); bundled, so no system SQLite is needed.
rusqlite = { version = "0.40", features = ["bundled", "hooks"] }

[lints]
workspace = true
