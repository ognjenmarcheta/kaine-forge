query GetConversations($limit: Int, $offset: Int) {
  conversations(limit: $limit, offset: $offset) {
    id
    title
    updatedAt
  }
}

query GetConversation($conversationId: ID!, $limit: Int, $offset: Int) {
  assistantMessages(conversationId: $conversationId, limit: $limit, offset: $offset) {
    id
    conversationId
    role
    content
    createdAt
    toolActions {
      tool
      input
      output
    }
  }
}

mutation DeleteConversation($id: ID!) {
  deleteConversation(id: $id)
}

mutation SendMessage($input: SendMessageInput!) {
  sendMessage(input: $input) {
    status
    conversationId
    reply
    message
    toolActions {
      tool
      input
      output
    }
  }
}

subscription OnAssistantMessageDelta {
  assistantMessageDelta {
    conversationId
    delta
  }
}
