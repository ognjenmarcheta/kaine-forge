query GetConversations($first: Int, $after: String) {
  conversations(first: $first, after: $after) {
    items {
      id
      title
      updatedAt
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

query GetConversation($conversationId: ID!, $first: Int, $after: String) {
  assistantMessages(conversationId: $conversationId, first: $first, after: $after) {
    items {
      id
      conversationId
      role
      content
      createdAt
      toolActions {
        tool
        input
        output
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

mutation DeleteConversation($id: ID!) {
  deleteConversation(id: $id)
}

mutation SendMessage($input: SendMessageInput!) {
  sendMessage(input: $input) {
    status
    conversationId
    reply
    message
    toolActions {
      tool
      input
      output
    }
  }
}

subscription OnAssistantMessageDelta {
  assistantMessageDelta {
    conversationId
    delta
  }
}
