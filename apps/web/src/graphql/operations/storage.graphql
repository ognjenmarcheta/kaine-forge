query GetFile($id: ID!) {
  file(id: $id) {
    id
    key
    originalName
    mimeType
    sizeBytes
    status
    entityType
    entityId
    downloadUrl
    createdAt
    updatedAt
  }
}

query GetFiles($filter: FilesFilterInput, $first: Int, $after: String) {
  files(filter: $filter, first: $first, after: $after) {
    items {
      id
      key
      originalName
      mimeType
      sizeBytes
      status
      entityType
      entityId
      downloadUrl
      createdAt
      updatedAt
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}

mutation RequestUploadUrl($input: RequestUploadInput!) {
  requestUploadUrl(input: $input) {
    fileId
    uploadUrl
    key
    expiresIn
  }
}

mutation ConfirmUpload($fileId: ID!) {
  confirmUpload(fileId: $fileId) {
    id
    key
    originalName
    mimeType
    sizeBytes
    status
    downloadUrl
    createdAt
    updatedAt
  }
}

mutation DeleteFile($fileId: ID!) {
  deleteFile(fileId: $fileId)
}
