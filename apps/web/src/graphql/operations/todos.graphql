query GetTodos($limit: Int, $offset: Int, $search: String, $completed: Boolean) {
  todos(limit: $limit, offset: $offset, search: $search, completed: $completed) {
    id
    title
    description
    completed
    attachments {
      id
      originalName
      mimeType
      sizeBytes
      downloadUrl
      thumbnailUrl
    }
    createdAt
    updatedAt
  }
}

query GetTodo($id: ID!) {
  todo(id: $id) {
    id
    title
    description
    completed
    createdAt
    updatedAt
    attachments {
      id
      originalName
      mimeType
      sizeBytes
      downloadUrl
      thumbnailUrl
    }
  }
}

mutation CreateTodo($input: CreateTodoInput!) {
  createTodo(input: $input) {
    id
    title
    description
    completed
    attachments {
      id
      originalName
      mimeType
      sizeBytes
      downloadUrl
      thumbnailUrl
    }
  }
}

mutation GenerateTodos($input: GenerateTodosInput!) {
  generateTodos(input: $input) {
    status
    message
    todos {
      id
      title
      description
      completed
      attachments {
        id
        originalName
        mimeType
        sizeBytes
        downloadUrl
        thumbnailUrl
      }
    }
  }
}

mutation UpdateTodo($id: ID!, $input: UpdateTodoInput!) {
  updateTodo(id: $id, input: $input) {
    id
    title
    description
    completed
    attachments {
      id
      originalName
      mimeType
      sizeBytes
      downloadUrl
      thumbnailUrl
    }
  }
}

mutation DeleteTodo($id: ID!) {
  deleteTodo(id: $id)
}

mutation ToggleTodo($id: ID!) {
  toggleTodo(id: $id) {
    id
    completed
    attachments {
      id
      originalName
      mimeType
      sizeBytes
      downloadUrl
      thumbnailUrl
    }
  }
}

subscription OnTodoCreated {
  todoCreated {
    id
  }
}

subscription OnTodoUpdated {
  todoUpdated {
    id
  }
}

subscription OnTodoDeleted {
  todoDeleted {
    id
  }
}

subscription OnTodoToggled {
  todoToggled {
    id
  }
}
