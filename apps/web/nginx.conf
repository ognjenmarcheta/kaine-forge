# Cache-Control by final URI (after try_files and index redirects). An empty
# value sends no header. Keeping it out of the locations matters: a location
# with its own add_header drops every server-level add_header below.
map $uri $cache_control {
    /index.html "no-store, no-cache, must-revalidate";
    ~^/assets/  "public, immutable";
    default     "";
}

server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass ${API_BACKEND_URL};
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /graphql {
        proxy_pass ${API_BACKEND_URL};
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_cache off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        access_log off;
    }

    location = /index.html {
        expires -1;
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # Every header is declared once, here. Do not add add_header to a location:
    # nginx would then drop all of these for that location.
    add_header Cache-Control $cache_control;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Single-quoted: BILLING_PAYMENT_ORIGINS holds `self` and double-quoted origins,
    # such as self "https://buy.paddle.com", that may use wallet payments. A frame
    # gets the feature only when this page has it too, so the list needs `self`.
    add_header Permissions-Policy 'camera=(), microphone=(), geolocation=(), payment=(${BILLING_PAYMENT_ORIGINS})' always;
    # Allows only what the built app loads. Origins come from Dockerfile.web env:
    # - script-src/frame-src: the Turnstile captcha widget and its iframe.
    # - style-src 'unsafe-inline': sonner injects a <style> element at runtime.
    # - img-src: data:/blob: previews, Public Asset URLs (CSP_PUBLIC_ASSET_ORIGINS),
    #   and presigned thumbnails from the private bucket (CSP_STORAGE_ORIGINS).
    # - connect-src: same-origin /graphql (http and ws), a cross-origin API
    #   (CSP_API_ORIGINS, http and ws), and presigned uploads (CSP_STORAGE_ORIGINS).
    # - CSP_BILLING_ORIGINS in script-src, connect-src, and frame-src: Paddle.js
    #   and its overlay checkout. Empty for Stripe, whose checkout is a redirect.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com ${CSP_BILLING_ORIGINS}; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: ${CSP_PUBLIC_ASSET_ORIGINS} ${CSP_STORAGE_ORIGINS}; connect-src 'self' ${CSP_API_ORIGINS} ${CSP_STORAGE_ORIGINS} ${CSP_BILLING_ORIGINS}; frame-src https://challenges.cloudflare.com ${CSP_BILLING_ORIGINS}; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
}
