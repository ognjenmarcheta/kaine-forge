type Query {
  health: String!
  todos(limit: Int, offset: Int): [Todo!]!
  todo(id: ID!): Todo
}

type Mutation {
  _empty: Boolean
  createTodo(input: CreateTodoInput!): Todo!
  updateTodo(id: ID!, input: UpdateTodoInput!): Todo!
  deleteTodo(id: ID!): Boolean!
  toggleTodo(id: ID!): Todo!
}

scalar DateTime

type Todo {
  id: ID!
  title: String!
  description: String
  completed: Boolean!
  createdAt: DateTime!
  updatedAt: DateTime!
}

input CreateTodoInput {
  title: String!
  description: String
}

input UpdateTodoInput {
  title: String
  description: String
  completed: Boolean
}
