type Query {
  health: String!
  organizations: [Organization!]!
  currentOrganization: Organization
  members: [OrganizationMember!]!
  todos(limit: Int, offset: Int): [Todo!]!
  todo(id: ID!): Todo
}

type Mutation {
  _empty: Boolean
  createTodo(input: CreateTodoInput!): Todo!
  updateTodo(id: ID!, input: UpdateTodoInput!): Todo!
  deleteTodo(id: ID!): Boolean!
  toggleTodo(id: ID!): Todo!
}

type Subscription {
  _empty: Boolean
}

type Organization {
  id: ID!
  name: String!
  slug: String!
  role: String!
}

type OrganizationMember {
  id: ID!
  userId: ID!
  email: String!
  name: String!
  role: String!
}

scalar DateTime

type Todo {
  id: ID!
  title: String!
  description: String
  completed: Boolean!
  organizationId: ID!
  createdAt: DateTime!
  updatedAt: DateTime!
}

input CreateTodoInput {
  title: String!
  description: String
}

input UpdateTodoInput {
  title: String
  description: String
  completed: Boolean
}
