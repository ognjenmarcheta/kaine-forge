type Query {
  health: String!
  organizations: [Organization!]!
  currentOrganization: Organization
  members: [OrganizationMember!]!
  invitations: [OrganizationInvitation!]!
  todos(limit: Int, offset: Int): [Todo!]!
  todo(id: ID!): Todo
  file(id: ID!): FileInfo
  files(filter: FilesFilterInput): [FileInfo!]!
}

type Mutation {
  _empty: Boolean
  createTodo(input: CreateTodoInput!): Todo!
  generateTodos(input: GenerateTodosInput!): GenerateTodosPayload!
  updateTodo(id: ID!, input: UpdateTodoInput!): Todo!
  deleteTodo(id: ID!): Boolean!
  toggleTodo(id: ID!): Todo!
  requestUploadUrl(input: RequestUploadInput!): PresignedUploadResponse!
  confirmUpload(fileId: ID!): FileInfo!
  deleteFile(fileId: ID!): Boolean!
}

type Subscription {
  _empty: Boolean
  todoCreated: Todo!
  todoUpdated: Todo!
  todoDeleted: TodoDeletedPayload!
  todoToggled: Todo!
}

type Organization {
  id: ID!
  name: String!
  slug: String!
  role: String!
}

type OrganizationMember {
  id: ID!
  userId: ID!
  email: String!
  name: String!
  role: String!
}

type OrganizationInvitation {
  id: ID!
  email: String!
  role: String!
  status: String!
  expiresAt: String!
}

scalar DateTime

type Todo {
  id: ID!
  title: String!
  description: String
  completed: Boolean!
  organizationId: ID!
  attachments: [FileInfo!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

input CreateTodoInput {
  title: String!
  description: String
}

input UpdateTodoInput {
  title: String
  description: String
  completed: Boolean
}

input GenerateTodosInput {
  prompt: String!
}

enum GenerateTodosStatus {
  CREATED
  AI_NOT_CONFIGURED
  FAILED
}

type GenerateTodosPayload {
  status: GenerateTodosStatus!
  todos: [Todo!]!
  message: String
}

type TodoDeletedPayload {
  id: ID!
  organizationId: ID!
}

enum FileStatus {
  pending
  uploaded
  deleted
}

type FileInfo {
  id: ID!
  key: String!
  bucket: String!
  originalName: String!
  mimeType: String!
  sizeBytes: Int!
  status: FileStatus!
  entityType: String
  entityId: ID
  downloadUrl: String
  createdAt: DateTime!
  updatedAt: DateTime!
}

type PresignedUploadResponse {
  fileId: ID!
  uploadUrl: String!
  key: String!
  expiresIn: Int!
}

input RequestUploadInput {
  originalName: String!
  mimeType: String!
  sizeBytes: Int!
  entityType: String
  entityId: ID
}

input FilesFilterInput {
  entityType: String
  entityId: ID
  status: FileStatus
  limit: Int
  offset: Int
}
