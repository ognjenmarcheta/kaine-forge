type Query {
  health: String!
  organizations: [Organization!]!
  currentOrganization: Organization
  members: [OrganizationMember!]!
  invitations: [OrganizationInvitation!]!
  organizationPermissions: [String!]!
  organizationTheme: String!
  todos(first: Int, after: String, search: String, completed: Boolean): TodoConnection!
  todo(id: ID!): Todo
  todoCounts: TodoCounts!
  notes(first: Int, after: String, search: String): NoteConnection!
  note(id: ID!): Note
  noteCount: Int!
  file(id: ID!): FileInfo
  files(filter: FilesFilterInput, first: Int, after: String): FileInfoConnection!
  publicAssets: PublicAssets!
  assistantMessages(conversationId: ID!, first: Int, after: String): AssistantMessageConnection!
  conversations(first: Int, after: String): AssistantConversationConnection!
  auditEvents(first: Int, after: String): AuditEventConnection!
  billing: BillingStatus!
  featureFlags: [FeatureFlag!]!
  notifications(first: Int, after: String): NotificationConnection!
  notificationPreferences: [NotificationPreference!]!
  dataExports(kind: DataExportKind!, first: Int, after: String): DataExportConnection!
  apiKeys(first: Int, after: String): ApiKeyConnection!
  webhookEventTypes: [String!]!
  webhookEndpoints(first: Int, after: String): WebhookEndpointConnection!
  webhookDeliveries(endpointId: ID!, first: Int, after: String): WebhookDeliveryConnection!
}

type Mutation {
  _empty: Boolean
  setOrganizationTheme(theme: String): String!
  createTodo(input: CreateTodoInput!): Todo!
  generateTodos(input: GenerateTodosInput!): GenerateTodosPayload!
  updateTodo(id: ID!, input: UpdateTodoInput!): Todo!
  deleteTodo(id: ID!): Boolean!
  toggleTodo(id: ID!): Todo!
  createNote(input: CreateNoteInput!): Note!
  updateNote(id: ID!, input: UpdateNoteInput!): Note!
  deleteNote(id: ID!): Boolean!
  addTodoToNote(noteId: ID!, input: CreateTodoInput!): Todo!
  requestUploadUrl(input: RequestUploadInput!): PresignedUploadResponse!
  confirmUpload(fileId: ID!): FileInfo!
  deleteFile(fileId: ID!): Boolean!
  requestPublicAssetUpload(input: RequestPublicAssetUploadInput!): PublicAssetUploadTicket!
  confirmPublicAssetUpload(kind: PublicAssetKind!, stagingKey: String!): PublicAssets!
  sendMessage(input: SendMessageInput!): SendMessagePayload!
  deleteConversation(id: ID!): Boolean!
  startCheckout(plan: BillingPlan!, interval: BillingInterval!): BillingCheckout!
  openBillingPortal: String!
  setFeatureFlagOverride(key: FeatureFlagKey!, enabled: Boolean!): [FeatureFlag!]!
  clearFeatureFlagOverride(key: FeatureFlagKey!): [FeatureFlag!]!
  markNotificationRead(id: ID!): Notification!
  markAllNotificationsRead: Int!
  updateNotificationPreference(input: NotificationPreferenceInput!): NotificationPreference!
  requestDataExport(kind: DataExportKind!): DataExport!
  dataExportDownloadUrl(id: ID!): String!
  createApiKey(input: CreateApiKeyInput!): CreatedApiKey!
  revokeApiKey(id: ID!): Boolean!
  createWebhookEndpoint(input: WebhookEndpointInput!): CreatedWebhookEndpoint!
  updateWebhookEndpoint(id: ID!, input: WebhookEndpointInput!): WebhookEndpoint!
  rotateWebhookSecret(id: ID!): String!
  deleteWebhookEndpoint(id: ID!): Boolean!
}

type Subscription {
  _empty: Boolean
  todoCreated: Todo!
  todoUpdated: Todo!
  todoDeleted: TodoDeletedPayload!
  todoToggled: Todo!
  noteCreated: Note!
  noteUpdated: Note!
  noteDeleted: NoteDeletedPayload!
  assistantMessageDelta: AssistantMessageDelta!
  notificationReceived: Notification!
}

"""
Where a page of a list ends. Pass endCursor as the list's after argument to
read the next page; every list field returns a <Type>Connection with items
and this pageInfo.
"""
type PageInfo {
  hasNextPage: Boolean!
  endCursor: String
}

type Organization {
  id: ID!
  name: String!
  slug: String!
  role: String!
}

type OrganizationMember {
  id: ID!
  userId: ID!
  email: String!
  name: String!
  role: String!
}

type OrganizationInvitation {
  id: ID!
  email: String!
  role: String!
  status: String!
  expiresAt: String!
}

scalar DateTime

type Todo {
  id: ID!
  title: String!
  description: String
  completed: Boolean!
  organizationId: ID!
  attachments: [FileInfo!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

input CreateTodoInput {
  title: String!
  description: String
}

input UpdateTodoInput {
  title: String
  description: String
  completed: Boolean
}

input GenerateTodosInput {
  prompt: String!
}

enum GenerateTodosStatus {
  CREATED
  AI_NOT_CONFIGURED
  FAILED
}

type GenerateTodosPayload {
  status: GenerateTodosStatus!
  todos: [Todo!]!
  message: String
}

type TodoCounts {
  open: Int!
  completed: Int!
}

type TodoConnection {
  items: [Todo!]!
  pageInfo: PageInfo!
}

type TodoDeletedPayload {
  id: ID!
  organizationId: ID!
}

type Note {
  id: ID!
  title: String!
  body: String
  organizationId: ID!
  todos: [Todo!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

input CreateNoteInput {
  title: String!
  body: String
}

input UpdateNoteInput {
  title: String
  body: String
}

type NoteDeletedPayload {
  id: ID!
  organizationId: ID!
}

type NoteConnection {
  items: [Note!]!
  pageInfo: PageInfo!
}

enum FileStatus {
  pending
  uploaded
  deleted
}

enum AttachmentEntityType {
  general
  todo
}

type FileInfo {
  id: ID!
  key: String!
  bucket: String!
  originalName: String!
  mimeType: String!
  sizeBytes: Int!
  status: FileStatus!
  entityType: AttachmentEntityType
  entityId: ID
  downloadUrl: String
  thumbnailUrl: String
  createdAt: DateTime!
  updatedAt: DateTime!
}

type PresignedUploadResponse {
  fileId: ID!
  uploadUrl: String!
  key: String!
  expiresIn: Int!
}

input RequestUploadInput {
  originalName: String!
  mimeType: String!
  sizeBytes: Int!
  entityType: AttachmentEntityType
  entityId: ID
}

input FilesFilterInput {
  entityType: AttachmentEntityType
  entityId: ID
  status: FileStatus
}

type FileInfoConnection {
  items: [FileInfo!]!
  pageInfo: PageInfo!
}

enum PublicAssetKind {
  avatar
  organization_logo
}

type PublicAssets {
  avatarUrl: String
  organizationLogoUrl: String
  uploadsEnabled: Boolean!
}

type PublicAssetUploadTicket {
  uploadUrl: String!
  stagingKey: String!
  expiresIn: Int!
}

input RequestPublicAssetUploadInput {
  kind: PublicAssetKind!
  mimeType: String!
  sizeBytes: Int!
}

type AssistantMessage {
  id: ID!
  conversationId: ID!
  role: String!
  content: String!
  createdAt: DateTime!
  toolActions: [AssistantToolAction!]!
}

type AssistantToolAction {
  tool: String!
  input: String
  output: String
}

type AssistantConversation {
  id: ID!
  title: String
  createdAt: DateTime!
  updatedAt: DateTime!
}

enum SendMessageStatus {
  REPLIED
  AI_NOT_CONFIGURED
  FAILED
}

type SendMessagePayload {
  status: SendMessageStatus!
  conversationId: ID!
  reply: String
  toolActions: [AssistantToolAction!]!
  message: String
}

input SendMessageInput {
  conversationId: ID
  message: String!
}

type AssistantMessageDelta {
  conversationId: ID!
  delta: String!
}

type AssistantMessageConnection {
  items: [AssistantMessage!]!
  pageInfo: PageInfo!
}

type AssistantConversationConnection {
  items: [AssistantConversation!]!
  pageInfo: PageInfo!
}

enum AuditAction {
  member_invited
  member_joined
  member_removed
  member_left
  member_role_changed
  ownership_transferred
  organization_renamed
  organization_theme_changed
  organization_deleted
  organization_exported
  organization_export_downloaded
  invitation_revoked
  two_factor_enabled
  two_factor_disabled
  password_changed
  passkey_added
  passkey_removed
  attachment_deleted
  feature_flag_override_changed
  role_created
  role_updated
  role_deleted
  api_key_created
  api_key_revoked
  webhook_endpoint_created
  webhook_endpoint_updated
  webhook_endpoint_deleted
  webhook_secret_rotated
  billing_checkout_started
  billing_portal_opened
  billing_subscription_changed
}

type AuditActor {
  id: ID!
  name: String!
  email: String!
}

type AuditEvent {
  id: ID!
  action: AuditAction!
  actor: AuditActor
  apiKeyId: ID
  targetType: String!
  targetId: ID!
  targetLabel: String
  ipAddress: String
  userAgent: String
  createdAt: DateTime!
}

type AuditEventConnection {
  items: [AuditEvent!]!
  pageInfo: PageInfo!
}

enum BillingProviderName {
  none
  stripe
  paddle
}

enum BillingPlan {
  free
  pro
  business
  unlimited
}

enum SubscriptionStatus {
  active
  trialing
  past_due
  canceled
  unpaid
  paused
  incomplete
  expired
}

enum BillingInterval {
  month
  year
}

enum BillingCheckoutMode {
  redirect
  overlay
}

type BillingCheckout {
  mode: BillingCheckoutMode!
  url: String
  transactionId: String
}

type BillingLimitUsage {
  key: String!
  max: Int
  used: Int!
}

type BillingStatus {
  provider: BillingProviderName!
  plan: BillingPlan!
  subscriptionStatus: SubscriptionStatus
  cancelAtPeriodEnd: Boolean!
  currentPeriodEnd: DateTime
  features: [String!]!
  limits: [BillingLimitUsage!]!
}

enum FeatureFlagKey {
  organizations_visible
}

type FeatureFlag {
  key: FeatureFlagKey!
  enabled: Boolean!
}

enum NotificationType {
  invitation_received
  role_changed
}

type InvitationReceivedNotification {
  invitationId: ID!
  inviterName: String!
  organizationName: String!
  role: String!
}

type RoleChangedNotification {
  organizationName: String!
  role: String!
}

union NotificationPayload = InvitationReceivedNotification | RoleChangedNotification

type Notification {
  id: ID!
  type: NotificationType!
  organizationId: ID
  payload: NotificationPayload!
  readAt: DateTime
  createdAt: DateTime!
}

type NotificationConnection {
  items: [Notification!]!
  pageInfo: PageInfo!
  unreadCount: Int!
}

type NotificationPreference {
  type: NotificationType!
  inApp: Boolean!
  email: Boolean!
  emailAvailable: Boolean!
}

input NotificationPreferenceInput {
  type: NotificationType!
  inApp: Boolean!
  email: Boolean!
}

enum DataExportKind {
  user
  organization
}

enum DataExportStatus {
  pending
  running
  ready
  failed
  expired
}

enum DataExportFailureReason {
  too_large
  error
}

type DataExport {
  id: ID!
  kind: DataExportKind!
  status: DataExportStatus!
  sizeBytes: Int
  failureReason: DataExportFailureReason
  createdAt: DateTime!
  completedAt: DateTime
  expiresAt: DateTime
}

type DataExportConnection {
  items: [DataExport!]!
  pageInfo: PageInfo!
}

type ApiKeyCreator {
  id: ID!
  name: String!
  email: String!
}

type ApiKey {
  id: ID!
  name: String!
  prefix: String!
  createdBy: ApiKeyCreator
  createdAt: DateTime!
  lastUsedAt: DateTime
  expiresAt: DateTime
}

type ApiKeyConnection {
  items: [ApiKey!]!
  pageInfo: PageInfo!
}

type CreatedApiKey {
  apiKey: ApiKey!
  key: String!
}

input CreateApiKeyInput {
  name: String!
  expiresInDays: Int
}

type WebhookEndpoint {
  id: ID!
  url: String!
  eventTypes: [String!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type WebhookEndpointConnection {
  items: [WebhookEndpoint!]!
  pageInfo: PageInfo!
}

type CreatedWebhookEndpoint {
  endpoint: WebhookEndpoint!
  secret: String!
}

type WebhookDelivery {
  id: ID!
  eventId: ID!
  eventType: String!
  attempt: Int!
  statusCode: Int
  durationMs: Int!
  error: String
  createdAt: DateTime!
}

type WebhookDeliveryConnection {
  items: [WebhookDelivery!]!
  pageInfo: PageInfo!
}

input WebhookEndpointInput {
  url: String!
  eventTypes: [String!]!
}
