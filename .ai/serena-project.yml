# Generic Serena project configuration for this template.
ignore_all_files_in_gitignore: true
ignored_paths: []
read_only: false
excluded_tools: []
initial_prompt: ""
project_name: "kaine-forge"
default_modes:
included_optional_tools: []
fixed_tools: []
encoding: utf-8
line_ending: lf
# REPL steering only, not enforcement: run commands with the agent's own shell.
excluded_apis: [shell, fs.create_text_file]
included_apis: [lsp.get_diagnostics_for_symbol, lsp.restart_language_server]
# Memories are generated from .ai/serena-memories; edit the canonical sources.
read_only_memory_patterns: [".*"]
language_servers:
  - typescript
# Load each TypeScript project so references can cross workspace boundaries.
ls_additional_workspace_folders:
  - .ai
  - apps/api
  - apps/desktop
  - apps/e2e
  - apps/mobile
  - apps/web
  - packages/auth
  - packages/db
  - packages/email
  - packages/feature-flags
  - packages/logger
  - packages/mobile-ui
  - packages/persistence
  - packages/query
  - packages/storage
  - packages/todos
  - packages/translation
  - packages/ui
  - tooling/desk
  - tooling/desk-ui
  - tooling/graphql-codegen
language_backend:
ignored_memory_patterns: []
